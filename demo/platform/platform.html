<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>µ-mural demo platform</title>
    <style>
        /* Full-viewport layout: html/body fill the browser window with
           no margins or document scrollbars. body is a vertical flex
           column so the header takes its natural height and #app gets
           the rest. */
        html, body { height: 100%; margin: 0; overflow: hidden;
                     background: #f1f5f9; color: #0f172a;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        header { flex: 0 0 auto;
                 padding: 10px 20px; background: #fff;
                 border-bottom: 1px solid #e2e8f0;
                 display: flex; align-items: center; gap: 16px; }
        header h1 { margin: 0; font-size: 14px; color: #334155; flex: 1 1 auto; }
        header h1 code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
                         font-size: 12px; }
        /* Theme toggle — small, label-only button. Bound to Material's
           ToggleTheme(); its caption flips to the next theme so the user
           sees what clicking it will do, not what's currently active. */
        #theme-toggle { flex: 0 0 auto;
                        padding: 6px 14px; border: 1px solid #cbd5e1;
                        background: #f1f5f9; color: #334155;
                        border-radius: 9999px; font-size: 12px;
                        cursor: pointer; }
        #theme-toggle:hover { background: #e2e8f0; }
        /* Dark-mode chrome for the host page so the body / header
           don't stay light when Material flips. Triggered by adding
           `data-theme="dark"` on <html>. */
        html[data-theme="dark"] body { background: #1c1b1f; color: #e6e1e5; }
        html[data-theme="dark"] header { background: #211f26; border-bottom-color: #49454f; }
        html[data-theme="dark"] header h1 { color: #cac4d0; }
        html[data-theme="dark"] header h1 code { background: #2b2930; color: #e6e1e5; }
        html[data-theme="dark"] #app { background: #1c1b1f; }
        html[data-theme="dark"] #theme-toggle { background: #2b2930; color: #e6e1e5;
                                                border-color: #49454f; }
        html[data-theme="dark"] #theme-toggle:hover { background: #36343b; }
        /* main + #app expand to fill the window; min-height:0 lets the
           flex child actually shrink below its content-box height so
           #app doesn't push beyond the viewport. */
        main { flex: 1 1 auto; min-height: 0; padding: 0; }
        #app { box-sizing: border-box;
               width: 100%; height: 100%;
               background: #fff; overflow: hidden;
               cursor: default; }
        #app svg { display: block; }
        #status { margin: 8px 20px; color: #b91c1c; font-family: ui-monospace, monospace;
                  font-size: 13px; white-space: pre-wrap; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "@visualisation-sub/mural/runtime":        "../../dist/runtime/index.js",
            "@visualisation-sub/mural/runtime/":       "../../dist/runtime/",
            "@visualisation-sub/mural/Basic":          "../../dist/Basic/index.js",
            "@visualisation-sub/mural/Basic/":         "../../dist/Basic/",
            "@visualisation-sub/mural/framework":           "../../dist/framework/index.js",
            "@visualisation-sub/mural/framework/":          "../../dist/framework/",
            "@visualisation-sub/mural/resources/material":  "../../dist/resources/material/index.js",
            "@visualisation-sub/mural/visual-engine":  "../../dist/visual-engine/index.js",
            "@visualisation-sub/mural/visual-engine/": "../../dist/visual-engine/",
            "opentype.js":                             "../opentype-shim.mjs"
        }
    }
    </script>
</head>
<body>
    <header>
        <h1>µ-mural demo platform — pick a demo from the <code>TreeView</code> on the left</h1>
        <button id="theme-toggle" type="button">Switch to dark</button>
    </header>
    <main>
        <div id="app"></div>
    </main>
    <pre id="status"></pre>

    <script type="module">
        // The shell — fully MVVM. PlatformVM holds the registered
        // demos plus the ItemTemplate / ItemContainerStyle / Title /
        // Subtitle / Content / SelectedDemo properties. platform.mu
        // binds every TreeView and PageView slot through DataContext.
        // No tree-walking, no selection-listener wiring, no FindName:
        // the only thing the host JS does is build the VM and hand it
        // to the root as DataContext.
        import { app }                                 from './platform.mu.js';
        import { HtmlTarget }                          from '@visualisation-sub/mural/visual-engine';
        // ToggleTheme / CurrentTheme power the header switch button —
        // theme activation itself runs inside platform.mu's IIFE via
        // the `Application[Theme=Material Scheme=MaterialLight]`
        // attribute, so the host script no longer has to call
        // app.initialize. By the time `app` is imported here, the
        // theme is already active and every control inside the IIFE
        // resolved its DynamicResource lookups against the live token
        // dictionary on first paint.
        import { ToggleTheme, CurrentTheme }
            from '@visualisation-sub/mural/resources/material';

        // Header theme toggle. Each click flips light↔dark via
        // ToggleTheme; the button caption advertises the NEXT theme
        // so the user sees what clicking it will do, not what's
        // already active. `data-theme="dark"` on <html> drives the
        // host-page CSS overrides above so the body / header / pad
        // chrome flip in lockstep with Material.
        const themeToggle = document.getElementById('theme-toggle');
        const applyHostChrome = () => {
            const t = CurrentTheme() ?? 'light';
            document.documentElement.setAttribute('data-theme', t);
            themeToggle.textContent = t === 'dark' ? 'Switch to light' : 'Switch to dark';
        };
        applyHostChrome();
        themeToggle.addEventListener('click', () => {
            ToggleTheme();
            applyHostChrome();
        });

        // Demo modules self-register on import. Each module calls
        // `register(...)` at top level — the side effect of importing
        // is enough to enroll the demo with the platform's registry.
        import '../demos/dashboard/dashboard.mjs';
        import '../demos/diagram/diagram.mjs';
        import '../demos/commands/commands.mjs';
        import '../demos/toggle-button/toggle-button.mjs';
        import '../demos/tool-bar/tool-bar.mjs';
        import '../demos/menu/menu.mjs';
        import '../demos/context-menu/context-menu.mjs';
        import '../demos/counter/counter.mjs';
        import '../demos/drawer/drawer.mjs';
        import '../demos/tree-view/tree-view.mjs';
        import '../demos/list-box/list-box.mjs';
        import '../demos/text-box/text-box.mjs';
        import '../demos/spin-edit/spin-edit.mjs';
        import '../demos/slider/slider.mjs';
        import '../demos/splitter/splitter.mjs';
        import '../demos/animation/animation.mjs';
        import '../demos/animation-declarative/animation-declarative.mjs';
        import '../demos/animation-triggers/animation-triggers.mjs';
        import '../demos/animation-named/animation-named.mjs';
        import '../demos/drag-drop/drag-drop.mjs';
        import '../demos/drag-drop-extended/drag-drop-extended.mjs';
        import '../demos/word-toolbox/word-toolbox.mjs';
        import '../demos/bouncing-ball/bouncing-ball.mjs';

        import { allDemos }   from './registry.mjs';
        import { PlatformVM } from './platform-vm.mjs';

        const status = document.getElementById('status');
        try {
            new HtmlTarget(document.getElementById('app')).Show(app.Root);
            app.Root.DataContext = new PlatformVM(allDemos());
        } catch (e) {
            status.textContent = 'Error: ' + (e?.message ?? String(e));
            console.error(e);
        }
    </script>
</body>
</html>
