<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>µ-mural demo platform</title>
    <style>
        /* Full-viewport layout: html/body fill the browser window with
           no margins or document scrollbars. body is a vertical flex
           column so the header takes its natural height and #app gets
           the rest. */
        html, body { height: 100%; margin: 0; overflow: hidden;
                     background: #f1f5f9; color: #0f172a;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        header { flex: 0 0 auto;
                 padding: 10px 20px; background: #fff;
                 border-bottom: 1px solid #e2e8f0; }
        header h1 { margin: 0; font-size: 14px; color: #334155; }
        header h1 code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
                         font-size: 12px; }
        /* main + #app expand to fill the window; min-height:0 lets the
           flex child actually shrink below its content-box height so
           #app doesn't push beyond the viewport. */
        main { flex: 1 1 auto; min-height: 0; padding: 0; }
        #app { box-sizing: border-box;
               width: 100%; height: 100%;
               background: #fff; overflow: hidden;
               cursor: default; }
        #app svg { display: block; }
        #status { margin: 8px 20px; color: #b91c1c; font-family: ui-monospace, monospace;
                  font-size: 13px; white-space: pre-wrap; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "@visualisation-sub/mural/runtime":       "../../dist/runtime/index.js",
            "@visualisation-sub/mural/Controls":      "../../dist/Controls/index.js",
            "@visualisation-sub/mural/visual-engine": "../../dist/visual-engine/index.js",
            "opentype.js":                            "../opentype-shim.mjs"
        }
    }
    </script>
</head>
<body>
    <header>
        <h1>µ-mural demo platform — pick a demo from the <code>TreeView</code> on the left</h1>
    </header>
    <main>
        <div id="app"></div>
    </main>
    <pre id="status"></pre>

    <script type="module">
        // The shell — fully MVVM. PlatformVM holds the registered
        // demos plus the ItemTemplate / ItemContainerStyle / Title /
        // Subtitle / Content / SelectedDemo properties. platform.mu
        // binds every TreeView and PageView slot through DataContext.
        // No tree-walking, no selection-listener wiring, no FindName:
        // the only thing the host JS does is build the VM and hand it
        // to the root as DataContext.
        import { app }        from './platform.mu.js';
        import { HtmlTarget } from '@visualisation-sub/mural/visual-engine';

        // Demo modules self-register on import. Each module calls
        // `register(...)` at top level — the side effect of importing
        // is enough to enroll the demo with the platform's registry.
        import '../demos/dashboard/dashboard.mjs';
        import '../demos/diagram/diagram.mjs';
        import '../demos/counter/counter.mjs';
        import '../demos/drawer/drawer.mjs';
        import '../demos/tree-view/tree-view.mjs';
        import '../demos/list-box/list-box.mjs';
        import '../demos/text-box/text-box.mjs';
        import '../demos/spin-edit/spin-edit.mjs';
        import '../demos/slider/slider.mjs';
        import '../demos/animation/animation.mjs';
        import '../demos/animation-declarative/animation-declarative.mjs';
        import '../demos/animation-triggers/animation-triggers.mjs';
        import '../demos/animation-named/animation-named.mjs';
        import '../demos/drag-drop/drag-drop.mjs';
        import '../demos/drag-drop-extended/drag-drop-extended.mjs';
        import '../demos/word-toolbox/word-toolbox.mjs';
        import '../demos/bouncing-ball/bouncing-ball.mjs';

        import { allDemos }   from './registry.mjs';
        import { PlatformVM } from './platform-vm.mjs';

        const status = document.getElementById('status');
        try {
            new HtmlTarget(document.getElementById('app')).Show(app.Root);
            app.Root.DataContext = new PlatformVM(allDemos());
        } catch (e) {
            status.textContent = 'Error: ' + (e?.message ?? String(e));
            console.error(e);
        }
    </script>
</body>
</html>
