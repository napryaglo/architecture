<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mural — Button + ComboBox + ICommand demo</title>
    <style>
        html, body { margin: 0; background: #f8fafc; color: #0f172a;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        header { padding: 16px 24px; background: #fff;
                 border-bottom: 1px solid #e2e8f0; }
        header h1 { margin: 0 0 4px; font-size: 18px; }
        header p  { margin: 0; color: #475569; font-size: 13px; }
        header code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px;
                      font-size: 12px; }
        main { padding: 24px; }
        #app { box-sizing: border-box;
               background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
               width: 460px; height: 380px; overflow: hidden;
               cursor: default; }
        #app svg { display: block; }
        #status { margin: 24px; color: #b91c1c; font-family: ui-monospace, monospace;
                  font-size: 13px; white-space: pre-wrap; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "@visualisation-sub/mural/runtime":       "../dist/runtime/index.js",
            "@visualisation-sub/mural/Controls":      "../dist/Controls/index.js",
            "@visualisation-sub/mural/visual-engine": "../dist/visual-engine/index.js",
            "opentype.js":                            "./opentype-shim.mjs"
        }
    }
    </script>
</head>
<body>
    <header>
        <h1>Button + ICommand demo</h1>
        <p>
            <code>CounterVM</code> exposes <code>Count</code>,
            <code>Increment</code>, <code>Reset</code>; mural's
            <code>$Increment</code> / <code>$Reset</code> bindings hand
            those commands to two <code>Button</code>s, and a
            <code>{{ String($Count) }}</code> inline expression keeps
            the display reactive. <code>Increment.CanExecute</code>
            returns false at 10 so the +1 button stops firing.
        </p>
    </header>
    <main>
        <div id="app"></div>
    </main>
    <pre id="status"></pre>

    <script type="module">
        import { app }                                    from './counter.mu.js';
        import { HtmlTarget }                             from '@visualisation-sub/mural/visual-engine';
        import { MetaData, Model, RelayCommand }          from '@visualisation-sub/mural/runtime';
        import { ComboBox }                               from '@visualisation-sub/mural/Controls';

        // View-model. Every binding-target field (Count, Step, Steps,
        // the two commands) is a registered Model DP so
        // DataContextBinding can subscribe to changes —
        // DataContextBinding walks the path and calls
        // AddPropertyChangedListener, which errors on unknown names.
        // Increment / Reset / Steps never change after construction,
        // but the registration is what makes them visible to the
        // binding machinery.
        class CounterVM extends Model {
            static {
                Model.RegisterProperty(CounterVM, 'Count',     0,         MetaData.None);
                Model.RegisterProperty(CounterVM, 'Step',      1,         MetaData.None);
                Model.RegisterProperty(CounterVM, 'Steps',     undefined, MetaData.None);
                Model.RegisterProperty(CounterVM, 'Increment', undefined, MetaData.None);
                Model.RegisterProperty(CounterVM, 'Reset',     undefined, MetaData.None);
            }
            get Count()     { return this.get_property_value('Count'); }
            set Count(v)    { this.set_property_value('Count', v); }
            get Step()      { return this.get_property_value('Step'); }
            set Step(v)     { this.set_property_value('Step', v); }
            get Steps()     { return this.get_property_value('Steps'); }
            get Increment() { return this.get_property_value('Increment'); }
            get Reset()     { return this.get_property_value('Reset'); }

            constructor() {
                super();
                // Step options the ComboBox exposes. Frozen so a stray
                // mutation can't break the binding identity.
                this.set_property_value('Steps', Object.freeze([1, 2, 5]));
                const inc = new RelayCommand(
                    () => { this.Count = Math.min(10, this.Count + this.Step); },
                    () => this.Count < 10,
                );
                this.set_property_value('Increment', inc);
                this.set_property_value('Reset',
                    new RelayCommand(() => { this.Count = 0; }));
                this.AddPropertyChangedListener('Count', () => {
                    inc.RaiseCanExecuteChanged();
                });
            }
        }

        // Walk the mounted tree for the ComboBox and wire the
        // back-direction (SelectedItem → VM.Step). DataContextBinding
        // is currently OneWay only, so the source-to-target flow
        // (vm.Step → combo.SelectedItem) is automatic, but pushing the
        // user pick back to the VM has to be done here for now. A
        // proper `TwoWay` binding mode in the compiler removes this
        // adapter; see the language follow-up.
        function findFirstByType(visual, ctor) {
            if (visual instanceof ctor) return visual;
            for (const child of visual.visualChildren) {
                const hit = findFirstByType(child, ctor);
                if (hit !== undefined) return hit;
            }
            return undefined;
        }

        const status = document.getElementById('status');
        try {
            const vm = new CounterVM();
            app.Root.DataContext = vm;
            new HtmlTarget(document.getElementById('app')).Show(app.Root);
            // Give the layout / render flush a microtask to settle so
            // the ComboBox is part of the visual tree before we hook.
            queueMicrotask(() => {
                const combo = findFirstByType(app.Root, ComboBox);
                if (combo !== undefined) {
                    combo.AddPropertyChangedListener('SelectedItem', () => {
                        const v = combo.SelectedItem;
                        if (typeof v === 'number') vm.Step = v;
                    });
                }
            });
        } catch (e) {
            status.textContent = 'Error: ' + (e?.message ?? String(e));
            console.error(e);
        }
    </script>
</body>
</html>
