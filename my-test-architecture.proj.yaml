# Rename this file to <your-project>.proj.yaml AND rename the
# project folder to match (the orchestrator looks for
# `<dir-name>.proj.yaml` by convention). The architect agent can do
# both in one step — ask it.
#
# Each entry under `models[]` declares one architecture or process.
# The agent populates this list as you author models with
# `/new-model <id>`.
