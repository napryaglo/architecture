# ─────────────────────────────────────────────────────────────────
# _default — fallback DataTemplate for component categories that
# don't have a specific template yet.
# ─────────────────────────────────────────────────────────────────
# Same shape as ai-chat: icon + label centered. The compiler uses
# this when a component's category has no matching DataTemplate.
# Per-category templates can be added incrementally without breaking
# the rendering of existing components.
# ─────────────────────────────────────────────────────────────────

type: data-template
target-category: _default

template:
  - stack:
      orientation: vertical
      h-align: center
      children:
        - image:
            src: $technology.icon
            size: { w: 38, h: 38 }
            margin: { top: 0, right: 0, bottom: 6, left: 0 }
        - text:
            content: $self.label
            font-family: "Segoe UI, Calibri, Arial, sans-serif"
            font-size: 10
            anchor: middle
            fill: "#333"
            # Cap the label box width so single-line labels longer than this
            # wrap at word boundaries instead of bloating the component bbox
            # and pushing into neighbours.
            max-width: 90
            margin: { top: 0, right: 0, bottom: 0, left: 0 }
