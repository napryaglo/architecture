# ─────────────────────────────────────────────────────────────────
# AI Chat — DataTemplate keyed by component category
# ─────────────────────────────────────────────────────────────────
# Fills the ContentPresenter inside the Component ControlTemplate.
# The icon comes from the technology library, resolved against the
# component's `implemented-by`.
#
# Layout uses a vertical `stack` with margin-driven spacing — no
# explicit positioning needed.
#
# Illustrative — one example. Other categories (foundation-model,
# semantic-index, data-store, ai-agent, mcp-server, service,
# orchestration-engine, platform-api, messaging, legacy-application,
# database) will follow the same shape.
# ─────────────────────────────────────────────────────────────────

type: data-template
target-category: ai-chat

template:
  - stack:
      orientation: vertical
      h-align: center
      children:
        - image:
            src: $technology.icon
            size: { w: 38, h: 38 }
            margin: { top: 0, right: 0, bottom: 6, left: 0 }
        - text:
            content: $self.label
            font-family: "Segoe UI, Calibri, Arial, sans-serif"
            font-size: 10
            anchor: middle
            fill: "#333"
            # Cap label box width so long single-line labels wrap at word
            # boundaries; see _default.yaml for the rationale.
            max-width: 90
            margin: { top: 0, right: 0, bottom: 0, left: 0 }
