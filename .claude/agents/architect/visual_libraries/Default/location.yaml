# Location — Style + ControlTemplate

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  title:            { type: string }
  subtitle:         { type: string }
  kind:             { type: enum, values: [top-level, nested, logical-grouping] }
  corner-radius:    { type: number }
  stroke-dasharray: { type: string }

# ── Style ────────────────────────────────────────────────────────
type: style
target: location

setters:
  corner-radius: 8
  stroke-width: 1
  margin: 5

  template:
    - border:
        rect: { x: 0, y: 0, width: $self.width, height: $self.height }
        rx: $self.corner-radius
        stroke: $self.stroke-color
        stroke-width: $self.stroke-width
        stroke-dasharray: $self.stroke-dasharray
        fill: $self.fill-color
        margin: { left: 5, top: 5, right: 5, bottom: 5 }
        padding: { left: 5, top: 5, right: 5, bottom: 5 }
        children:
          - stack-panel:
              orientation: vertical
              stretch: uniform
              h-align: stretch
              children:
                - text:
                    content: $self.title
                    at: { x: 12, y: 28 }
                    font-family: "Segoe UI, Calibri, Arial, sans-serif"
                    font-size: 14
                    font-weight: bold
                    anchor: start
                    fill: $self.stroke-color
                - text:
                    when: $self.subtitle
                    content: $self.subtitle
                    at: { x: 12, y: 46 }
                    font-family: "Segoe UI, Calibri, Arial, sans-serif"
                    font-size: 10
                    font-style: italic
                    anchor: start
                    fill: $self.stroke-color
                - border:
                    stretch: vertical
                    children:
                      - items-presenter:
                          layout: stack-panel-vertical
                          stretch: uniform

triggers:
  - when: { kind: nested }
    setters:
      stroke-width: 1
  - when: { kind: logical-grouping }
    setters:
      stroke-dasharray: "8,4"
