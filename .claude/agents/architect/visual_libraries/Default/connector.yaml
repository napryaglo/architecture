# Connector — Style

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  path:              { type: list-of-points,
                       description: "Resolved waypoints (set by the layout pass; authors don't write this)." }
  from:              { type: ref, description: "Source endpoint: $id or $id.anchor." }
  to:                { type: ref, description: "Target endpoint: $id or $id.anchor." }
  relationship-type: { type: enum, values: [interaction, enablement, hosting] }
  routing:           { type: enum, values: [straight, orthogonal-hv, orthogonal-vh, orthogonal-auto],
                       description: "How the path is drawn between endpoints. `orthogonal-auto` picks HV or VH from the longer axis between endpoints." }
  arrow-end:         { type: enum, values: [none, source, target, both],
                       description: "Which end(s) carry an arrow head." }
  arrow-size:        { type: number, description: "Pixel size of the arrow tip." }
  stroke-dasharray:  { type: string }

# ── Style ────────────────────────────────────────────────────────
type: style
target: connector

setters:
  stroke-color: "#8A8780"
  stroke-width: 1
  fill-color: none
  # Connectors default to orthogonal routing (auto-picks HV or VH based on the
  # longer axis between endpoints). Authors override per-connector with
  # `[routing = straight]` or use the explicit `-|` / `|-` ops.
  routing: orthogonal-auto
  arrow-end: none
  arrow-size: 5.6
  # Minimum source-to-target bounding-box dimensions enforced by the
  # connector-aware layout pass (read by anchor-ref placement to widen the
  # gap between endpoints when their natural anchor offset is too tight).
  min-width: 50
  min-height: 50

triggers:
  - when: { relationship-type: interaction }
    setters:
      stroke-dasharray: ""
      arrow-end: target
  - when: { relationship-type: enablement }
    setters:
      stroke-dasharray: "6,3"
      arrow-end: target
  - when: { relationship-type: hosting }
    setters:
      stroke-dasharray: "2,2"
      arrow-end: none
