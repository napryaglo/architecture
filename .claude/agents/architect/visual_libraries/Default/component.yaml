# Component — Style + ControlTemplate

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label:    { type: string }
  category: { type: ref, target: data-template,
              description: "Drives DataTemplate selection at composition time." }
  content:  { type: data,
              description: "Data slot — DataTemplate matched by category fills the ContentPresenter." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: component

setters:
  margin: 10
  template:
    - content-presenter:
        rect: { x: 0, y: 0 }
