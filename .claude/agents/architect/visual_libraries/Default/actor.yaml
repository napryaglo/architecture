# Actor — Style + ControlTemplate

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label: { type: string }
  icon:  { type: ref, description: "Icon resource path." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: actor

setters:
  icon: resources/actor.svg
  margin: 10
  template:
    - stack:
        orientation: vertical
        h-align: center
        rect: { x: 0, y: 0, width: $self.width, height: $self.height }
        children:
          - image:
              src: $self.icon
              size: { w: 38, h: 38 }
              margin: { top: 0, right: 0, bottom: 14, left: 0 }
          - text:
              content: $self.label
              font-family: "Segoe UI, Calibri, Arial, sans-serif"
              font-size: 10
              anchor: middle
              fill: "#22211E"
              margin: { top: 0, right: 0, bottom: 0, left: 0 }
