# ─────────────────────────────────────────────────────────────────
# Building Block — Style + ControlTemplate
# ─────────────────────────────────────────────────────────────────

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  title:            { type: string }
  subtitle:         { type: string }
  corner-radius:    { type: number }
  header-height:    { type: number }
  content-padding:  { type: number }
  label-font-size:  { type: number }
  divider-opacity:  { type: number, range: [0, 1] }

# ── Style ────────────────────────────────────────────────────────
type: style
target: building-block

setters:
  corner-radius: 10
  stroke-width: 1
  content-padding: 28
  label-font-size: 10
  divider-opacity: 0.4
  margin: 10

  template:
    - border:
        rect: { x: 0, y: 0 }
        rx: $self.corner-radius
        stroke-width: $self.stroke-width
        stroke: $parent-location.stroke-color
        fill:   $parent-location.fill-color
        children:
            - stack-panel:
                orientation: vertical
                children:
                    - text:
                        content: $self.title
                        at: { x: 14, y: 22 }
                        font-family: "Segoe UI, Calibri, Arial, sans-serif"
                        font-size: 12
                        font-weight: bold
                        fill: $parent-location.stroke-color
                    - text:
                        margin: 5
                        when: $self.subtitle
                        content: $self.subtitle
                        font-family: "Segoe UI, Calibri, Arial, sans-serif"
                        font-size: 10
                        font-style: italic
                        fill: $parent-location.stroke-color
                    - items-presenter:
                        layout: stack-panel-horizontal
