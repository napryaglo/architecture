# ─────────────────────────────────────────────────────────────────
# Lane — sub-band inside a pool
# ─────────────────────────────────────────────────────────────────
# A lane is a horizontal sub-stripe inside a pool, partitioning the
# pool's vertical extent. Visually mirrors the pool's structure:
# left-edge title strip + content area for flow nodes.
#
# Lanes don't carry semantic weight on their own — they're an
# organisational device. Multiple lanes inside one pool just
# subdivide the pool by role/department; flow tokens cross lane
# boundaries freely (the validator enforces only that flow nodes
# belong to the right lane).
#
# Lane shrink-wraps around its flow nodes (taller lanes = more
# stacked content; wider lanes = wider flow-node bounds).
# ─────────────────────────────────────────────────────────────────

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label: { type: string,
           description: "Lane label — typically a role or department name." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: lane

setters:
  stroke-color: "#8A8780"
  stroke-width: 1
  fill-color:   "none"
  margin:       0

  template:
    # Lane border — same dock-panel split as pool, but lighter stroke
    # so lane boundaries are visually subordinate to pool boundaries.
    - border:
        rect: { x: 0, y: 0, width: $self.width, height: $self.height }
        stroke: $self.stroke-color
        stroke-width: $self.stroke-width
        fill: $self.fill-color
        children:
          - dock-panel:
              children:
                # Vertical title strip on the left — narrower than
                # pool's because lane labels are typically shorter
                # and visually subordinate.
                - border:
                    dock: left
                    width: 24
                    fill: "#FAFAF9"
                    stroke: $self.stroke-color
                    stroke-width: 0
                    children:
                      - text:
                          content: $self.label
                          at: { x: 12, y: 0 }
                          font-family: "Segoe UI, Calibri, Arial, sans-serif"
                          font-size: 10
                          anchor: middle
                          fill: "#5F5C56"
                          rotation: -90       # bottom-to-top, BPMN convention
                # Flow-node container. Layout is canvas-style absolute
                # positioning so the auto-renderer can place tasks /
                # events / gateways at computed (x, y) coordinates.
                - items-presenter:
                    layout: canvas
