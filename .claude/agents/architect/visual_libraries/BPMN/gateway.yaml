# ─────────────────────────────────────────────────────────────────
# Gateway — diamond with type marker
# ─────────────────────────────────────────────────────────────────
# A 50×50 diamond with a small marker centred inside indicating the
# routing semantics. BPMN's marker conventions:
#
#   exclusive (XOR)  — X    (or empty for "implicit XOR")
#   parallel (AND)   — +
#   inclusive (OR)   — ○
#   event-based      — pentagon containing ◯ (waiting for events)
#   complex          — *    (author-defined routing)
#
# The label sits adjacent to the diamond — typically below for
# diverging gateways or beside for converging joins. This template
# places it below for simplicity.
#
# Implementation note: visual primitives don't include a diamond
# shape directly. Approximated with a polygon primitive when
# available, or a rotated square via a future renderer enhancement.
# Until then, the template uses a rotated-square hint via an SVG
# polygon (drawn as an embedded image asset). Marker icons live as
# SVG files under resources/gateway-<type>.svg, resolved from the
# `type` field by the markup compiler.
# ─────────────────────────────────────────────────────────────────

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label:   { type: string,
             description: "Optional label — common for exclusive gateways phrasing the decision (\"Payment OK?\")." }
  type:    { type: enum,
             values: [exclusive, parallel, inclusive, event-based, complex],
             description: "Routing semantics. Drives the marker inside the diamond." }
  default: { type: ref,
             description: "Outgoing flow id taken when no other branch's condition is true. Exclusive/inclusive gateways only." }
  marker:  { type: ref,
             description: "Resolved by the markup compiler from `type` against resources/." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: gateway

setters:
  stroke-color: "#22211E"
  stroke-width: 1
  fill-color:   "#FFFFFF"
  margin:       6
  width:        50
  height:       50
  padding:      { bottom: 16 }   # reserves space for label below

  template:
    # Diamond — currently approximated by an SVG polygon image.
    # When the visual primitives gain a `polygon` shape (or a
    # rotated `border`), this can become a native shape with the
    # marker drawn directly inside. For now we composite: outer
    # diamond as a single SVG asset, marker as a centred image.
    - image:
        src:  resources/gateway-diamond.svg
        size: { w: 50, h: 50 }
        at:   { x: 0, y: 0 }
    - image:
        when: $self.marker
        src:  $self.marker
        size: { w: 22, h: 22 }
        at:   { x: 14, y: 14 }
    # Label below.
    - text:
        when: $self.label
        content: $self.label
        at: { x: 25, y: 54 }
        font-family: "Segoe UI, Calibri, Arial, sans-serif"
        font-size: 10
        anchor: middle
        fill: "#22211E"
