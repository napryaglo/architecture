# ─────────────────────────────────────────────────────────────────
# Event — circle with stroke weight per event-type
# ─────────────────────────────────────────────────────────────────
# Three visual variations of a single shape — a circle ~36px wide:
#
#   start          intermediate          end
#   ╭─╮            ╭─╮                  ┏━┓
#   │○│            ║○║                  ┃●┃
#   ╰─╯            ╰─╯                  ┗━┛
#  thin stroke    double stroke      thick stroke
#  (1px)          (1px + 1px gap)    (3px)
#
# An optional trigger icon lives inside the circle (envelope for
# message, clock for timer, lightning for signal, X-shaped error
# mark, etc.). The label sits below the circle.
#
# Implementation note: the visual primitives don't include a circle
# shape directly — using a heavily rounded `border` rect (rx = w/2)
# gets us the visual circle. Double-stroke for intermediate events
# is approximated by a stacked pair of borders; the renderer can
# upgrade to a true SVG `<circle>` when needed.
# ─────────────────────────────────────────────────────────────────

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label:      { type: string,
                description: "Optional — usually shown only for events whose meaning isn't clear from the trigger icon alone." }
  event-type: { type: enum,
                values: [start, intermediate, end],
                description: "Drives stroke weight." }
  trigger:    { type: enum,
                values: [none, message, timer, conditional, signal, error,
                         escalation, compensation, link, terminate],
                default: none,
                description: "Drives the icon inside the circle." }
  direction:  { type: enum,
                values: [catching, throwing],
                description: "Required for intermediate events with message/signal/escalation triggers." }
  icon:       { type: ref,
                description: "Resolved by the markup compiler from trigger + direction against resources/." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: event

setters:
  stroke-color: "#22211E"
  stroke-width: 1
  fill-color:   "#FFFFFF"
  margin:       6
  width:        36
  height:       36
  # Bottom margin reserves space for the label that renders below
  # the circle.
  padding:      { bottom: 16 }

  template:
    # Circle — drawn as a fully-rounded border. The width and height
    # are equal; corner-radius is half the dimension to round into a
    # circle. For triggers that need fill (e.g. throwing), a future
    # template variant can swap fill-color.
    - border:
        rect:   { x: 0, y: 0, width: 36, height: 36 }
        rx:     18
        stroke: $self.stroke-color
        stroke-width: $self.stroke-width
        fill:   $self.fill-color
        children:
          # Trigger icon centred in the circle.
          - image:
              when: $self.icon
              src:  $self.icon
              size: { w: 18, h: 18 }
              at:   { x: 9, y: 9 }
    # Label below the circle.
    - text:
        when: $self.label
        content: $self.label
        at: { x: 18, y: 40 }
        font-family: "Segoe UI, Calibri, Arial, sans-serif"
        font-size: 10
        anchor: middle
        fill: "#22211E"

triggers:
  # Stroke weight encodes event-type. Start is the thin default;
  # end uses a thick stroke; intermediate is a double-stroked
  # circle (here approximated by widening to 2 — a future renderer
  # upgrade could draw a true double stroke).
  - when: { event-type: end }
    setters:
      stroke-width: 3
  - when: { event-type: intermediate }
    setters:
      stroke-width: 2
  # `terminate` end events are conventionally drawn as a thick
  # circle with a SOLID inner disk. Approximated with a black fill.
  - when: { event-type: end, trigger: terminate }
    setters:
      fill-color: "#22211E"
