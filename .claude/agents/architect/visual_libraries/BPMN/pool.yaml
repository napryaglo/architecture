# ─────────────────────────────────────────────────────────────────
# Pool — swimlane container per participant
# ─────────────────────────────────────────────────────────────────
# A pool is a horizontal stripe representing one participant in the
# process (organisation, system, role). Visually:
#
#   ┌─────────────────────────────────────────────────────────┐
#   │ T │                                                     │
#   │ I │                                                     │
#   │ T │   <lanes stacked vertically inside>                 │
#   │ L │                                                     │
#   │ E │                                                     │
#   └─────────────────────────────────────────────────────────┘
#
# The "TITLE" strip on the left runs vertically with the pool name
# rotated -90° (reads bottom-to-top per BPMN convention). The text
# primitive's `rotation:` field handles this; the renderer emits
# `transform="rotate(-90 cx cy)"` around the text's anchor.
#
# Pools shrink-wrap to their lanes' bounds + the title strip width.
# ─────────────────────────────────────────────────────────────────

# ── Element type definition ──────────────────────────────────────
extends: base
properties:
  label: { type: string,
           description: "Pool label — typically the participant's name (organisation, system, role)." }

# ── Style ────────────────────────────────────────────────────────
type: style
target: pool

setters:
  stroke-color: "#22211E"
  stroke-width: 1
  fill-color:   "#FFFFFF"
  margin:       { top: 8, right: 8, bottom: 8, left: 8 }

  template:
    # Outer pool border. The dock-panel splits the inner area into
    # the title strip (left edge) and the lanes container (everything
    # else). The dock-panel's `last-child-fills` default lets the
    # items-presenter consume the remaining width.
    - border:
        rect: { x: 0, y: 0, width: $self.width, height: $self.height }
        stroke: $self.stroke-color
        stroke-width: $self.stroke-width
        fill: $self.fill-color
        children:
          - dock-panel:
              children:
                # Vertical title strip docked on the left edge. Width
                # is fixed; children of this strip render the pool's
                # label centred (visually, this should be rotated 90°
                # — limitation noted in README).
                - border:
                    dock: left
                    width: 30
                    fill: "#F4F4F4"
                    stroke: $self.stroke-color
                    stroke-width: 0
                    children:
                      - text:
                          content: $self.label
                          at: { x: 15, y: 0 }
                          font-family: "Segoe UI, Calibri, Arial, sans-serif"
                          font-size: 11
                          font-weight: bold
                          anchor: middle
                          fill: $self.stroke-color
                          rotation: -90       # bottom-to-top, BPMN convention
                # Lanes container — vertical stack of injected lane
                # children. The items-presenter consumes the remainder
                # of the dock-panel.
                - items-presenter:
                    layout: stack-panel-vertical
                    stretch: uniform
