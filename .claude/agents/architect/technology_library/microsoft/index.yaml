# ─────────────────────────────────────────────────────────────────
# Microsoft Technology Library — index
# ─────────────────────────────────────────────────────────────────
# Concrete technologies in the Microsoft cloud stack. Imported by
# architecture definition files via `imports: [microsoft]`.
#
# Library entries live under top-level `categories:` and/or
# `technologies:` blocks. This library exposes only technologies.
# Each technology entry:
#   - label:         display name for diagrams
#   - icon:          path to icon asset (paths starting with
#                    `resources/` are library-relative; paths starting
#                    with `technology_library/` or `ai_ea/` are
#                    project-root-relative)
#   - available-in:  locations where the technology can run
#   - applicable-to: categories this technology can plausibly fill in
#                    a component's `category:` slot. Non-exclusive list.
#   - wiki:          filename of the wiki page (purpose + trade-offs)
#                    in this library folder
#
# Library dependencies:
#   This library imports `default` so the meta-model categories used
#   by Microsoft technologies are available transitively.
# ─────────────────────────────────────────────────────────────────

imports:
  - default

technologies:

  # ── Microsoft 365 ──────────────────────────────────────────────
  microsoft-graph:
    label:         Microsoft Graph
    icon:          resources/microsoft_graph.svg
    available-in:  [m365]
    applicable-to: [platform-api]
    wiki:          microsoft-graph.md

