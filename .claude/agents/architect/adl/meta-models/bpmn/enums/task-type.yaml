# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Task Type (BPMN)
# ═════════════════════════════════════════════════════════════════
# Classifies a task by what kind of work performs it. Drives visual
# treatment in BPMN diagrams (each type has a distinct icon in the
# top-left corner of the task's rounded rectangle) and informs
# semantic checks (a `service` task can't have a human assignee; a
# `manual` task can't reference an automated handler).
#
# The `none` value is BPMN's default for an unspecialised task —
# rendered as a plain rounded rectangle with no icon. Used when the
# author hasn't decided on the task type yet, or genuinely doesn't
# care.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Task Type
slug: task-type

description: |
  Classifies a BPMN task by what kind of work performs it. Drives
  the small icon rendered in the top-left of the task rectangle and
  may inform semantic validation.

values:

  - id:    none
    label: Unspecialised
    description: |
      Plain task with no icon. The default when the author hasn't
      committed to a specific kind.

  - id:    user
    label: User Task
    description: |
      Performed by a human via a worklist application. Carries
      assignee/role metadata in fuller BPMN models.

  - id:    service
    label: Service Task
    description: |
      Performed by an automated service or API call. No human in the
      loop.

  - id:    manual
    label: Manual Task
    description: |
      Performed by a human without any system support (paper form,
      phone call, physical handling). Distinct from `user` because no
      worklist entry is created.

  - id:    script
    label: Script Task
    description: |
      Executed automatically by a script engine inside the process
      runtime. Distinct from `service` because the work happens
      in-engine rather than via an external call.

  - id:    business-rule
    label: Business Rule Task
    description: |
      Evaluates a decision via a rules engine (e.g. DMN). The output
      is typically a decision the next gateway uses to route.

  - id:    send
    label: Send Task
    description: |
      Sends a message to a participant outside the pool. Pairs with
      a Receive task on the other side via a message flow.

  - id:    receive
    label: Receive Task
    description: |
      Waits for a message from a participant outside the pool.
      Pairs with a Send task on the other side.

references:
  - https://www.omg.org/spec/BPMN/2.0/
