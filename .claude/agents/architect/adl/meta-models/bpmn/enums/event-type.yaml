# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Event Type (BPMN)
# ═════════════════════════════════════════════════════════════════
# Classifies an event by where in the process flow it sits. Three
# values:
#
#   - start         — initiates a process. Drawn as a thin-stroked
#                     circle. Every process must have at least one
#                     start event.
#   - intermediate  — happens during the process, neither starting
#                     nor ending it. Drawn as a double-stroked
#                     circle. May be CATCHING (waits for a trigger
#                     to fire) or THROWING (emits the trigger).
#   - end           — terminates a flow path. Drawn as a thick-
#                     stroked circle. A process may have multiple
#                     end events (different outcomes).
#
# This enum classifies POSITION. The TRIGGER (what the event
# responds to or emits — message, timer, error, signal, etc.) is a
# separate enum: `event-trigger`.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Event Type
slug: event-type

description: |
  Classifies a BPMN event by its position in the process flow:
  start (initiates), intermediate (happens during), or end
  (terminates). The trigger semantics — what the event reacts to or
  emits — are captured separately in `event-trigger`.

values:

  - id:    start
    label: Start
    description: |
      Initiates a process. A process has at least one start event
      per top-level flow.

  - id:    intermediate
    label: Intermediate
    description: |
      Happens during the process, neither starting nor ending it.
      Catching variants wait for a trigger to fire (e.g. a timer
      expiring); throwing variants emit a trigger (e.g. sending a
      signal).

  - id:    end
    label: End
    description: |
      Terminates a flow path. A process may have multiple end events
      to model different outcomes (success, error, cancellation).

references:
  - https://www.omg.org/spec/BPMN/2.0/
