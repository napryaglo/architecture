# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Gateway Type (BPMN)
# ═════════════════════════════════════════════════════════════════
# Routing semantics for a gateway. The most semantically loaded
# enum in the BPMN spec — different gateway types route flow tokens
# differently:
#
#   exclusive    — XOR: exactly one outgoing branch fires; conditions
#                  are mutually exclusive; the first true branch wins.
#                  Diamond with an X (or empty for "implicit XOR").
#   parallel     — AND: all outgoing branches fire simultaneously; no
#                  conditions; tokens later synchronise at a matching
#                  parallel join. Diamond with a +.
#   inclusive    — OR: every branch whose condition is true fires;
#                  zero or more branches per execution. Diamond with
#                  a circle (○).
#   event-based  — Like exclusive but the choice is driven by which
#                  intermediate event fires first (typically a race
#                  between a timer and a message). Diamond with a
#                  pentagon containing an empty circle.
#   complex      — Author-defined routing logic that doesn't fit the
#                  above patterns. Rare in practice — usually a sign
#                  the process should be redesigned. Diamond with *.
#
# Validation hooks: a parallel gateway's outgoing branches must NOT
# carry conditions (the conditions would be ignored). An exclusive
# or inclusive gateway's outgoing branches SHOULD carry conditions
# (or one branch designated `default` to catch the no-match case).
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Gateway Type
slug: gateway-type

description: |
  Routing semantics for a BPMN gateway. The choice determines how
  flow tokens fork (one outgoing branch vs. all vs. some) and merge
  (when the tokens reconverge). Drives the icon inside the gateway's
  diamond shape.

values:

  - id:    exclusive
    label: Exclusive (XOR)
    description: |
      Exactly one outgoing branch fires. Conditions on outgoing flows
      are mutually exclusive; the first true branch wins. One branch
      may be designated `default` to catch the no-match case. Diamond
      with an X (or unmarked for "implicit exclusive").

  - id:    parallel
    label: Parallel (AND)
    description: |
      All outgoing branches fire simultaneously. No conditions. A
      matching parallel gateway downstream synchronises the tokens
      back into a single flow. Diamond with a +.

  - id:    inclusive
    label: Inclusive (OR)
    description: |
      Every outgoing branch whose condition is true fires; zero or
      more branches per execution. The matching downstream gateway
      waits for exactly the branches that fired. Diamond with a
      circle (○).

  - id:    event-based
    label: Event-Based
    description: |
      Like exclusive but the choice is determined by which downstream
      intermediate event fires first — typically a race between a
      timer and a message. Diamond with a pentagon containing an
      empty circle.

  - id:    complex
    label: Complex
    description: |
      Author-defined routing logic that doesn't fit the standard
      patterns. Rare; usually indicates the process should be
      redesigned with simpler gateways. Diamond with *.

references:
  - https://www.omg.org/spec/BPMN/2.0/
