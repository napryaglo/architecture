# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Data Object (BPMN)
# ═════════════════════════════════════════════════════════════════
# Information that flows between activities — an order document, a
# payment receipt, a customer record. Visually a small page-shape
# (rectangle with a folded top-right corner) with the data label
# below it.
#
# Data objects connect to flow nodes via DATA ASSOCIATIONS — a
# different visual primitive from sequence and message flows
# (dotted line, no fill on the arrowhead). Data associations are
# directional: a data object can be an INPUT to an activity (data
# flows in) or an OUTPUT (data flows out). The same data object may
# be both input to one activity and output from another, modelling
# a pipeline.
#
# State. A data object can carry a STATE annotation indicating its
# condition at the point of the diagram (e.g. "[validated]",
# "[shipped]"). Useful for showing how the same logical document
# transitions through the process.
#
# Modeling intent. Data objects are documentation, not runtime
# directives — most BPMN runtimes ignore them. They earn their
# place when readers need to see WHAT moves between activities, not
# just THAT something does. For tightly-data-driven processes the
# clarity is worth the visual noise; for control-flow-dominated
# diagrams skip them.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Data Object
slug: data-object

description: |
  Information that flows between activities. Visual: small page
  shape with optional state annotation. Connected to flow nodes by
  data associations (dotted lines), which are directional (input vs
  output).

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier

  - name: label
    type: label
    description: 'Data document name (e.g. "Order", "Payment Receipt").'

  - name: state
    type: string
    cardinality: '0..1'
    description: |
      Optional state annotation drawn in brackets next to the
      label (e.g. "validated", "shipped"). Used to show how the
      same logical document transitions.

  - name: collection
    type: boolean
    default: false
    description: |
      When true, the data object represents a COLLECTION of
      instances rather than a single document (e.g. "Order Lines"
      where each task processes one line). Visual: triple-bar mark
      at the bottom of the page shape.

# ── Relationships ────────────────────────────────────────────────
relationships:

  - name: input-to
    target: task
    cardinality: '*'
    description: 'Activities that read this data object as input.'

  - name: output-from
    target: task
    cardinality: '*'
    description: 'Activities that write this data object as output.'

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: Data object ids are unique within the process.

  - description: |
      A data object should appear in at least one association
      (input or output). Orphan data objects with no incoming or
      outgoing arrows are documentation noise — the validator
      emits a warning, not an error.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: dict-form
    example: |
      data-objects:
        order:
          label: Order
          state: validated
        order-lines:
          label:      Order Lines
          collection: true
        receipt:
          label: Payment Receipt

references:
  - https://www.omg.org/spec/BPMN/2.0/
