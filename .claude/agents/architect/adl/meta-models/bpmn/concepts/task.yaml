# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Task (BPMN)
# ═════════════════════════════════════════════════════════════════
# An atomic activity in the process — work that gets done as a
# single unit. Visually a rounded rectangle with the task label
# centred and an optional task-type icon in the top-left.
#
# Tasks are the workhorse concept. Most flow nodes in a typical
# diagram are tasks; events and gateways exist to control the flow
# around them.
#
# Sub-processes (compound activities that expand into their own
# inner flow) are NOT modelled here as a separate concept yet —
# they'd be a future addition. For now, model a sub-process by
# extracting it into its own `.bpmn.yaml` file under a different
# id and referencing it externally if cross-referencing becomes
# necessary.
#
# Authoring shortcut. A task with `type: none` and no other
# annotations renders as a plain unmarked rectangle — fine for early
# drafts. Tightening the type later is just an attribute change; no
# structural rewrite needed.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Task
slug: task

description: |
  An atomic activity in the process. Visual: rounded rectangle with
  the label centred and an optional task-type icon in the top-left.
  Carries its task type (user / service / manual / script / etc.)
  via `type`.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier

  - name: label
    type: label
    description: Display name shown inside the task rectangle.

  - name: type
    type:
      enum: task-type
    default: none
    description: |
      What kind of work performs this task. Drives the icon in the
      top-left corner. Defaults to `none` — a plain task with no
      icon, fine for early drafts.

  - name: assignee
    type: string
    cardinality: '0..1'
    description: |
      Free-form assignee description for `user` tasks (e.g. a role
      name, a group, an expression). Optional even for user tasks.
      Out of scope for non-user tasks; the validator may warn if set
      on a `service` or `script` task.

# ── Relationships ────────────────────────────────────────────────
relationships:

  - name: lives-in
    target: lane
    cardinality: '1'
    description: |
      Every task belongs to exactly one lane (which belongs to
      exactly one pool). The lane's `flow-nodes[]` entry references
      this task by id.

  - name: incoming
    target: sequence-flow
    cardinality: '*'
  - name: outgoing
    target: sequence-flow
    cardinality: '*'

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: Task ids are unique within the process.

  - description: |
      A task lives in exactly one lane. Lanes' `flow-nodes[]` must
      not list the same task id twice across different lanes.

  - description: |
      A `service` or `script` task SHOULD NOT carry an assignee —
      no human is in the loop. Validator emits a warning, not an
      error.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: dict-form
    description: |
      Tasks may live in a top-level `tasks:` map or be authored
      inline inside a lane's content (depending on which authoring
      shape the BPMN compiler ends up adopting). The dict-form key
      is the task id.
    example: |
      tasks:
        receive-order:
          label: Receive Order
          type:  receive
        validate-payment:
          label: Validate Payment
          type:  service
        review-discount:
          label: Review Discount Request
          type:  user
          assignee: sales-manager

references:
  - https://www.omg.org/spec/BPMN/2.0/
