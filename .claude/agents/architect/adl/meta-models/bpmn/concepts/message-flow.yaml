# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Message Flow (BPMN)
# ═════════════════════════════════════════════════════════════════
# An asynchronous message exchange between two flow nodes in
# DIFFERENT POOLS. Models cross-participant communication —
# typically a Send task on one side paired with a Receive task or
# a message-trigger event on the other.
#
# Visual: dashed arrow with an unfilled (open) circle at the source
# end and an open triangular tip at the target. The dashed style
# distinguishes it instantly from a sequence flow (solid arrow).
#
# Message flows MUST cross pool boundaries. The validator rejects an
# intra-pool message flow with a hint that the author probably wants
# a sequence flow.
#
# What endpoints message flows can connect:
#
#   Sender side (source):
#     - Send task
#     - Throwing message event (intermediate or end)
#     - Pool boundary (anonymous "from this participant")
#
#   Receiver side (target):
#     - Receive task
#     - Catching message event (start, intermediate)
#     - Pool boundary (anonymous "to this participant")
#
# Message-flow contents (the payload schema, the message reference)
# aren't modelled here. A future extension could add a `message`
# concept naming reusable message types; for now a `label` is enough.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Message Flow
slug: message-flow

description: |
  An inter-pool asynchronous message. Visual: dashed arrow with
  open circle at source, open triangle at target. Cannot stay
  within a single pool — that's a sequence flow.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier
    cardinality: '0..1'

  - name: from
    type: identifier
    description: |
      Sender id. Either a flow node (Send task, throwing message
      event) or a pool id (anonymous "from this participant").

  - name: to
    type: identifier
    description: |
      Receiver id. Either a flow node (Receive task, catching
      message event) or a pool id (anonymous "to this participant").

  - name: type
    type:
      enum: flow-type
    default: message
    description: 'Always `message`. Stated explicitly when authoring in a unified flows list.'

  - name: label
    type: string
    cardinality: '0..1'
    description: |
      Message name or short description (e.g. "Order Confirmation",
      "Payment Request"). Drawn near the centre of the dashed arrow.

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      Source and target must belong to DIFFERENT pools. A message
      flow whose endpoints sit in the same pool is rejected with a
      hint to use a sequence flow.

  - description: |
      Sender side must be capable of emitting a message — a Send
      task, a throwing message event, or a pool boundary. Other
      kinds of node aren't valid sources.

  - description: |
      Receiver side must be capable of catching a message — a
      Receive task, a catching message event, or a pool boundary.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: object-form
    description: |
      In the same top-level `flows:` list as sequence flows; `type:
      message` distinguishes them.
    example: |
      flows:
        - { from: customer-place-order, to: receive-order,
            type: message, label: "Order Submission" }
        - { from: order-fulfilled,      to: customer-confirmation,
            type: message, label: "Order Confirmation" }

references:
  - https://www.omg.org/spec/BPMN/2.0/
