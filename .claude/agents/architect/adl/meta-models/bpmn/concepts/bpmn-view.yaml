# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: BPMN View
# ═════════════════════════════════════════════════════════════════
# A diagram of one specific BPMN process. The BPMN meta-model's
# analogue to enterprise-architecture's `view` — same tight-coupling
# rules apply (one view binds to exactly one process, declared in
# the view source's `view $<id>` directive matching the process's
# `meta.id`).
#
# Same DSL, same extension, same parser as architecture views.
# Originally drafted as a separate `.bpmn-view` extension on the
# theory that BPMN's vocabulary (pools, lanes, tasks, gateways)
# would warrant a distinct dialect; in practice the typical BPMN
# view is template-driven (empty body, layout generated from the
# process via the registered `auto-layout` template), and even
# hand-authored BPMN views fit the same `view $<id> [attrs] { body }`
# outer shape — only the element-type names inside the body would
# differ. So one extension and one parser; dispatch to the right
# generator/visualisation happens by the bound model's meta-model,
# not by file extension.
#
# Status. Template-driven views work end-to-end via the BPMN visual
# compiler (`bpmn_engine/visual_compiler/visual_compiler.py`) once
# the orchestrator wires up template dispatch — the open thread
# tracked in hand-off-summary.md §8. Hand-authored BPMN views are a
# future addition to the existing view parser; no separate compiler
# planned.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: BPMN View
slug: bpmn-view

description: |
  A diagram of one BPMN process. Shares the `.view` extension and
  DSL with enterprise-architecture views; bound to a process via
  the `view $<id>` directive matching `meta.id`. Most BPMN views
  set `model-template: auto-layout` so the body stays empty and
  layout comes from the registered generator.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier
    description: |
      View id. Unique within its process only. The viewer addresses
      views via the generated `<process.id>/<view.id>` handle (same
      shape as `<model.id>/<view.id>` for architecture views).

  - name: label
    type: string
    cardinality: '0..1'

  - name: source
    type: string
    cardinality: '0..1'
    description: |
      Optional path to the `.view` source. Default by convention:
      `<project>/models/<process.id>/views/<view.id>.view`. Mutually
      exclusive with `model-template:` — a view is either
      hand-authored (DSL source) or framework-generated (template).

  - name: model-template
    type: identifier
    cardinality: '0..1'
    description: |
      Name of a framework-registered data template that builds the
      whole view from the bound process. The typical authoring mode
      for BPMN — a process flow's layout is mechanical (swimlane
      bands, topological left-to-right placement, orthogonal
      connectors), so a generator produces a clean diagram from the
      model alone with no human layout decisions needed. The current
      registered template is `auto-layout`, implemented by
      `bpmn_engine/visual_compiler/visual_compiler.py`. Mutually
      exclusive with `source:`.

  - name: handle
    type: string
    description: |
      Generated `<process.id>/<view.id>`. Authored by the
      orchestrator, not the user.

  - name: dom-id
    type: string
    description: 'Generated `<process.id>__<view.id>`.'

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      View ids unique within the parent process. Project-wide
      uniqueness via the generated handle.

  - description: |
      The `.view`'s `view $<id>` directive equals its process's
      `meta.id`. Same tight-coupling rule the enterprise-architecture
      meta-model enforces. Doesn't apply to template-driven views
      with empty bodies — the binding comes from the descriptor.

  - description: |
      `source:` and `model-template:` are mutually exclusive. Most
      BPMN views set `model-template:` (typically `auto-layout`); a
      hand-authored `.view` body for a BPMN process is the rare
      case used only when the generated layout doesn't capture some
      intent the author wants to express explicitly.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: descriptor-entry
    description: |
      How a BPMN view appears in the project descriptor. The common
      shape is template-driven: declare the view, point at a
      registered template, no separate source file authored.
    example: |
      models:
        - id:         order-fulfillment
          label:      Order Fulfillment
          meta-model: bpmn
          source:     models/order-fulfillment/order-fulfillment.bpmn.yaml
          views:
            - id:             auto
              label:          Process Flow
              model-template: auto-layout

  - form: view-source
    description: |
      The `.view` DSL itself. Same outer shape as architecture
      views (imports + `view $<id> [attrs] { body }`); template-
      driven views leave the body empty and let the generator fill
      it. A hand-authored body would use BPMN primitives (pool,
      lane, task, event, gateway, …) instead of architecture
      primitives — these are simply additional element-type names
      the existing parser accepts.
    example: |
      import visual-library BPMN

      view $order-fulfillment [
          title          = "Order Fulfillment — Happy Path"
          background     = "#FAFAF9"
          model-template = auto-layout
      ]
      {
      }

references:
  - https://www.omg.org/spec/BPMN/2.0/
