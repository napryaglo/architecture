# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Event (BPMN)
# ═════════════════════════════════════════════════════════════════
# Something that happens in the process — distinct from a task in
# that the process doesn't perform an event, the event simply
# occurs (or is signalled). Visually a circle; stroke weight encodes
# `event-type` (thin = start, double = intermediate, thick = end).
# A trigger icon may appear inside the circle.
#
# An event carries TWO classifying attributes:
#
#   - event-type: position in the flow (start, intermediate, end).
#                 Determines stroke weight and where the event is
#                 legal in the flow graph.
#
#   - trigger:    what the event reacts to or emits (none, message,
#                 timer, error, signal, etc.). Determines the icon
#                 inside the circle.
#
# Catching vs throwing. Some triggers (message, signal, escalation)
# distinguish CATCHING (event waits for the trigger to fire) from
# THROWING (event emits the trigger). For start events catching is
# implicit; for end events throwing is implicit; for intermediate
# events the spec distinguishes them explicitly. Captured here as a
# `direction:` field.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Event
slug: event

description: |
  Something that happens in the process. Carries an `event-type`
  (start / intermediate / end) determining position in flow, and a
  `trigger` determining what the event responds to or emits.
  Visual: circle, stroke weight per type, trigger icon inside.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier

  - name: label
    type: label
    cardinality: '0..1'
    description: |
      Optional human label, drawn below the event circle. Many
      events read fine from their trigger icon alone (a clock means
      timer, an envelope means message); the label adds context
      ("on order placed", "deadline reached").

  - name: event-type
    type:
      enum: event-type
    description: |
      Position in the flow: start (initiates the process),
      intermediate (happens during), end (terminates a flow path).

  - name: trigger
    type:
      enum: event-trigger
    default: none
    description: |
      What the event reacts to (catching) or emits (throwing).
      `none` means an unspecialised event — usually only seen on
      generic start / end events.

  - name: direction
    type: string
    cardinality: '0..1'
    description: |
      `catching` or `throwing`. Required for intermediate events
      where both make sense; implicit for start (catching) and end
      (throwing).

# ── Relationships ────────────────────────────────────────────────
relationships:

  - name: lives-in
    target: lane
    cardinality: '1'

  - name: incoming
    target: sequence-flow
    cardinality: '*'
    description: |
      Cardinality varies by event-type — start events have zero
      incoming sequence flows; end events have zero outgoing.

  - name: outgoing
    target: sequence-flow
    cardinality: '*'

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: Event ids are unique within the process.

  - description: |
      Start events have NO incoming sequence flows. They're how
      flow tokens enter the process; an arrow into a start event is
      a modelling error.

  - description: |
      End events have NO outgoing sequence flows. They terminate a
      flow path; an arrow out of an end event is a modelling error.

  - description: |
      Intermediate events with the `message`, `signal`, or
      `escalation` trigger MUST set `direction` to either `catching`
      or `throwing`. The spec rejects an intermediate message event
      that doesn't say which.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: dict-form
    example: |
      events:
        order-placed:
          label:      On Order Placed
          event-type: start
          trigger:    message
        deadline-reached:
          label:      Deadline Reached
          event-type: intermediate
          trigger:    timer
          direction:  catching
        order-fulfilled:
          label:      Order Fulfilled
          event-type: end
        payment-failed:
          label:      Payment Failed
          event-type: end
          trigger:    error

references:
  - https://www.omg.org/spec/BPMN/2.0/
