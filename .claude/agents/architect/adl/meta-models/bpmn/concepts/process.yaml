# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Process (BPMN)
# ═════════════════════════════════════════════════════════════════
# The root concept for the BPMN meta-model — the unit a per-meta-
# model compiler operates on. Authored as one `<id>.bpmn.yaml` file.
# A process is composed of pools (which contain lanes which contain
# tasks/events/gateways) plus the flows between them.
#
# A process has at least one start event and at least one end event
# (or terminate event); a flow that doesn't reach an end is a
# modelling error the validator catches.
#
# Process scope:
#
#   - "Public process" (also called "abstract process" / "choreography")
#     models only the messages exchanged with external participants —
#     the internal activity is hidden. Out of scope here.
#
#   - "Private process" (also called "internal process" /
#     "orchestration") models the full internal flow plus its message
#     interactions. This is what `process` represents in this meta-model.
#
# A project may contain multiple processes — each lives in its own
# `.bpmn.yaml` file under `models/<process-id>/`.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Process
slug: process

description: |
  The root concept of a BPMN model. A process is one private
  (internal) process composed of pools, lanes, and flow nodes
  (tasks, events, gateways) connected by sequence flows and message
  flows. Authored as a single `<id>.bpmn.yaml` file.

# ── Identity properties (authored in the project descriptor) ─────
properties:

  - name: id
    type: identifier
    description: |
      Stable kebab-case process id. MUST equal the process's
      `meta.id` and the model directory name. Plays the same role as
      a `model.id` in the enterprise-architecture meta-model.

  - name: label
    type: string
    cardinality: '0..1'
    description: Human-readable process label; surfaces in the viewer.

  - name: source
    type: string
    description: Path to the `.bpmn.yaml` source file (project-relative).

  - name: views
    type:
      list:
        ref: bpmn-view
    cardinality: '*'
    description: |
      Explicit list of views authored or generated for this process.
      Mirrors the architecture meta-model's `model.views`. Most BPMN
      views set `model-template:` to a registered generator
      (currently `auto-layout`); a hand-authored `.bpmn-view` source
      is the rare case. A process with zero views is legal — the
      process still compiles and the manifest still lists it.

# ── Process content (inside the .bpmn.yaml) ──────────────────────

  - name: meta
    type:
      object:
        id:         { type: identifier, required: true }
        title:      { type: string }
        meta-model: { type: identifier }
    description: |
      Identity block. `meta.id` MUST equal the process id in the
      project descriptor. Optional `meta.meta-model:` self-identifies
      which meta-model the file follows; for BPMN files the value is
      `bpmn`. The compiler errors on a mismatch between the file's
      declared meta-model and what the compiler implements.

  - name: pools
    type:
      list:
        ref: pool
    cardinality: '1..*'
    description: |
      Pools partition the process by participant. A "single-pool"
      process is the common case — one organisation's perspective on
      the flow. Multi-pool processes are required when the process
      involves message exchange with external participants.

  - name: data-objects
    type:
      list:
        ref: data-object
    cardinality: '*'
    description: |
      Data objects that flow between activities. Optional — many
      processes don't model data explicitly.

  - name: flows
    type:
      list:
        ref: sequence-flow
    cardinality: '*'
    description: |
      Sequence flows AND message flows authored at the process
      level. Sequence flows MUST stay within a single pool; message
      flows MUST cross pool boundaries. The validator enforces both
      rules.

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      Every process has at least one start event somewhere in its
      pools. A process with no start event is unreachable.
    formal: '∃ e ∈ events(process): e.event-type = start'

  - description: |
      Every flow node has a path to at least one end event (or
      terminate event). Dead-end nodes are a modelling error.

  - description: |
      Sequence flows stay within a single pool. A sequence flow
      whose source and target are in different pools is rejected
      with a hint to use a message flow instead.

  - description: |
      Message flows cross pool boundaries. A message flow whose
      source and target are in the same pool is rejected with a
      hint to use a sequence flow instead.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: yaml
    description: |
      A single self-contained `.bpmn.yaml` file. Top-level keys
      mirror the architecture meta-model's `.arch.yaml`: `meta:`,
      then content blocks.
    example: |
      meta:
        id:    order-fulfillment
        title: Order Fulfillment Process

      pools:
        customer:
          label: Customer
          lanes:
            self: { label: Customer }
        seller:
          label: Seller
          lanes:
            sales:    { label: Sales }
            shipping: { label: Shipping }

      flows:
        - { from: customer-place-order,    to: receive-order,    type: message }
        - { from: receive-order,           to: validate-payment, type: sequence }
        - ...

references:
  - https://www.omg.org/spec/BPMN/2.0/
