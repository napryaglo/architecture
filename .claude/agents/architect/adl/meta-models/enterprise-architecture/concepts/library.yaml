# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Library
# ═════════════════════════════════════════════════════════════════
# A reusable bundle of categories and/or technologies. Lives under
# `technology_library/<name>/` with an `index.yaml` plus an optional
# `resources/` folder for icons.
#
# Libraries can import other libraries — the model_compiler resolves
# the chain depth-first with cycle detection. Convention: a model's
# `imports:` clause is its full dependency manifest, listing every
# transitively-reachable library explicitly. So `microsoft` imports
# `default`, but a model that uses Microsoft tech still says
# `imports: [default, microsoft]` rather than relying on the
# transitive resolve.
#
# Two libraries today:
#
#   - `default/`    — twelve baseline component categories
#                     (`ai-chat`, `ai-agent`, `database`, …) and their
#                     fallback icons. No technologies.
#
#   - `microsoft/`  — twenty-four Microsoft cloud technologies
#                     (Azure services, M365, Power Platform).
#                     Imports `default` for the categories.
#
# The first-import-wins rule for cross-library collisions is rarely
# exercised in practice. When two libraries genuinely disagree
# (e.g. they both define `azure-openai-gpt4o` differently), the
# project-level `custom-technologies:` block is the override hook.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Library
slug: library

description: |
  A reusable bundle of categories and/or technologies, plus its own
  transitive `imports:` declarations and an optional resources folder
  for icons. Pulled in by a model via its `imports:` clause.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: name
    type: identifier
    description: |
      Library directory name under `technology_library/`. The model
      compiler treats the directory name as the library's id.

  - name: imports
    type:
      list: identifier
    cardinality: '*'
    description: |
      Other library names this library depends on. Resolved
      depth-first by `model_compiler.resolve_imports`. Cycles are
      rejected with an explicit error.

  - name: categories
    type:
      list:
        object:
          id:   { type: { enum: component-category }, required: true }
          icon: { type: string }
    cardinality: '*'
    description: |
      Library-supplied category-icon overrides. The category ids
      resolve in the `component-category` enum. The default library
      provides the fallback icons; vendor libraries don't typically
      override them.

  - name: technologies
    type:
      list:
        ref: technology
    cardinality: '*'

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      Library `imports[]` resolve to other libraries; cycles are
      rejected. The compiler tracks an `in-progress` set during
      depth-first import resolution and bails when it sees a name
      already on the stack.

  - description: |
      Inline `categories:` / `technologies:` at the architecture
      level (project-side) override library entries on id collision;
      libraries themselves don't override each other (first-import
      wins). When a project genuinely needs a different version of a
      library entry, it uses `custom-technologies:` not a library
      override.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: index-yaml
    description: 'Lives at `technology_library/<name>/index.yaml`.'
    example: |
      imports:
        - default

      technologies:
        azure-openai-gpt4o:
          label: Azure OpenAI (GPT-4o)
          icon:  resources/azure-openai.svg
          available-in: [azure]
          applicable-to: [language-model]

      # categories: { ... } when the library exposes new categories
      # (the default library defines them; vendor libraries don't).

references:
  - modeling_engine/wiki/03-libraries.md
  - modeling_engine/Compiler/model_compiler.py
