# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Model
# ═════════════════════════════════════════════════════════════════
# A single architecture — locations, actors,
# blocks, components, the connectors between them, and the scenarios
# that exercise them. Authored as one `<id>.arch.yaml` file.
#
# A model is the unit the model_compiler operates on. Views are
# scoped to a single model — a view file declares which model it
# belongs to via `view $<arch-id>` and the orchestrator validates
# that the id matches the model's `meta.id`. Models are independent
# from each other: cross-model references are forbidden by design.
#
# Why "globally unique component ids" inside a model rather than
# inside a project: the markup layer (visualization side) needs
# unique handles for path expressions and binding resolution. Flat
# global ids inside a model are the cleanest substrate for that.
# Across models we re-use the namespace — two different models can
# both have a component called `database` because the viewer
# addresses them via `<model.id>/<view.id>` URLs and the markup
# compiler runs per-model.
#
# Inheritance / specialisation between models is NOT supported. If
# two architectures share a common substrate, the substrate goes
# in a library (`technology_library/<name>/index.yaml`) which both
# models import. Libraries can carry categories and technologies but
# not blocks/components/scenarios — those stay project-local.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Model
slug: model

description: |
  A single architecture — locations, actors, blocks, components, the
  connectors between them, the scenarios that exercise them. Authored
  as one `<id>.arch.yaml` file. Models are the unit the model_compiler
  operates on; views are scoped to a single model.

# ── Identity-side properties (authored in the descriptor) ────────
# These three appear in the project descriptor's `models[]` entry.
properties:

  - name: id
    type: identifier
    description: |
      Stable kebab-case model id. MUST equal the model's `meta.id` and
      the model directory name; the orchestrator validates the
      equivalence at build time. The viewer's URL prefix uses this id
      (`?view=<model.id>/<view.id>`).

  - name: label
    type: string
    cardinality: '0..1'
    description: |
      Human-readable model label; surfaces in the viewer's model
      picker dropdown. Defaults to the id when missing.

  - name: source
    type: string
    description: |
      Path to the `.arch.yaml` source file (project-relative). By
      convention `models/<model.id>/<model.id>.arch.yaml` but the
      explicit path lets unusual layouts work.

  - name: views
    type:
      list:
        ref: view
    cardinality: '*'
    description: |
      Explicit list of views authored for this model. Within-model
      unique by id; project-wide uniqueness comes via the generated
      `<model.id>/<view.id>` handle. A model with zero views is legal
      (the model still compiles and the manifest still lists it) — it
      just has nothing to show in the viewer's stage.

# ── Architecture-content properties (inside the .arch.yaml) ──────
# These five blocks describe the architecture itself. They appear at
# the top level of `<model.id>.arch.yaml`.

  - name: meta
    type:
      object:
        id:         { type: identifier, required: true }
        title:      { type: string }
        meta-model: { type: identifier }
    description: |
      Identity block. `meta.id` MUST equal the model.id declared in
      the project descriptor — the orchestrator parses the .view's
      `view $<id>` directive and rejects mismatches. Optional
      `meta.meta-model:` self-identifies which meta-model the file
      follows; for architecture files the value is
      `enterprise-architecture`. The compiler errors on a mismatch
      between the file's declared meta-model and what the compiler
      implements.

  - name: imports
    type:
      list: identifier
    cardinality: '*'
    description: |
      Library names to resolve transitively from
      `technology_library/<name>/index.yaml`. The model compiler
      walks each library's own `imports:` clause too — a model that
      imports `microsoft` automatically gets `default` because the
      microsoft library declares it as a dependency.

  - name: locations
    type:
      list:
        ref: location
    cardinality: '*'

  - name: actors
    type:
      list:
        ref: actor
    cardinality: '*'

  - name: custom-technologies
    type:
      list:
        ref: technology
    cardinality: '*'
    description: |
      Project-specific technology entries that override library
      imports on id collision. Used for entries that aren't reusable
      across architectures (custom services, project-specific glue).
      Distinct keyword from libraries' `technologies:` so the
      authoring intent reads as "local override".

  - name: categories
    type:
      list:
        object:
          id:   { type: { enum: component-category }, required: true }
          icon: { type: string }
    cardinality: '*'
    description: |
      Inline overrides for imported category-icon mappings. Rarely
      needed — most projects accept the library defaults — but useful
      when a project wants its own visual treatment for a category.

  - name: scenarios
    type:
      list:
        ref: scenario
    cardinality: '*'

  - name: blocks
    type:
      list:
        ref: block
    cardinality: '*'

  - name: components
    type:
      list:
        ref: component
    cardinality: '*'
    description: |
      Standalone components (not inside a block), grouped under their
      `<location>` keys in the source for organisational clarity. The
      compiler flattens these to the global components-by-id map at
      compile time.

  - name: connectors
    type:
      list:
        ref: connector
    cardinality: '*'
    description: |
      Standalone typed connectors authored at the architecture level.
      Distinct from scenario-step connectors which are derived from
      `scenarios[].sequences[].steps[]` — both end up in the
      compiled output's unified `connectors:` block, distinguished
      by `source:`.

# ── Relationships to other concepts ──────────────────────────────
relationships:

  - name: belongs-to
    target: project
    cardinality: '1'
    description: A model is owned by exactly one project.

  - name: bound-by
    target: view
    cardinality: '*'
    description: |
      Views bind to this model via the `view $<meta.id>` directive in
      the `.view` source. Tight coupling — mismatch is a build error.
      A model can have zero views (build still succeeds) but each view
      has exactly one model.

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      Component ids are globally unique across the entire model.
      Authors of large models may need explicit `id:` to disambiguate
      cases that the autogen would collide on (e.g. two AI Agents in
      different locations both auto-id'd as `ai-agent`).
    formal: '∀ c1, c2 ∈ components(model): c1 ≠ c2 ⇒ c1.id ≠ c2.id'

  - description: |
      Actor, block, location, and component ids share a single global
      namespace — no two of them may collide. Helps catch typos
      (`platform-api` referenced in a step that doesn't match any of
      the four).

  - description: |
      Every `imports[]` resolves to an existing
      `technology_library/<name>/index.yaml`. Failed imports fail the
      build (exit code 2 — internal error rather than validation
      error, because the project setup is broken not the data).

  - description: |
      Component `category` resolves in the inlined registry (after
      library imports + custom overrides). Aliases are accepted —
      `ai-chat` resolves to the same category as
      `conversational-interface`.

  - description: |
      `meta.id` equals the model.id in the project descriptor. The
      orchestrator's `validate_view_bindings` checks every .view's
      `view $<id>` matches `meta.id`; this invariant captures that
      the meta.id and descriptor model.id must agree in the first
      place.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: yaml
    description: |
      A single self-contained `.arch.yaml` file. The compiler resolves
      library imports transitively and emits a flat compiled YAML at
      `<project>/output/<config>/<model.id>/<model.id>.arch.compiled.yaml`.
    example: |
      meta:
        id: enterprise
        title: AI Enterprise Architecture

      imports:
        - default
        - microsoft

      locations:
        azure: { label: Azure, type: cloud/paas }
        ...

      actors:
        business-user: { label: Business User, type: internal }

      scenarios:
        conversational:
          label: Conversational
          outcome: "..."
          sequences:
            - sequence:
                Title: ...
                Entry Point: business-user
                steps: ["business-user → chat-surface", ...]

      blocks:    { ... }
      components: { ... }
      connectors: [ ... ]

references:
  - modeling_engine/wiki/01-meta-model.md
  - modeling_engine/wiki/02-schema.md
  - modeling_engine/Compiler/model_compiler.py
