# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Step
# ═════════════════════════════════════════════════════════════════
# A single transition in a sequence — an arrow from a source
# endpoint to a destination endpoint, optionally typed. Each step
# compiles to one connector record in the model's unified
# `connectors:` block, carrying the parent scenario, sequence, and
# 0-based step index.
#
# Authoring shape. A step is always a YAML string, never a
# structured object. The grammar is `<src> → <dst>` (default kind
# `calls`) or `<src> →[<kind>] <dst>` (explicit kind). The arrow
# character is the Unicode `→` (U+2192). ASCII `->` is NOT accepted
# — we picked Unicode deliberately so the source reads like a
# diagram and the parser doesn't have to disambiguate `-` (used in
# many ids) from the arrow.
#
# Why steps are strings, not objects. They read like English. A
# compact list of 14 string steps fits on a screen; the same list
# as 14 structured objects with `from:`/`to:`/`type:` would be
# unreadable. The trade-off is worth it for scenarios specifically
# (where readability of the timeline matters); the standalone
# `connectors:` block accepts both shapes because there the
# structure-vs-prose decision varies per entry.
#
# Permitted kinds. Steps may carry only the runtime-flow types —
# `calls`, `event`, `consumes`. Structural types (`enabled-by`,
# `hosted-by`, `available-through`) are rejected in step authoring;
# they belong in the standalone `connectors:` block. The compiler
# enforces this — see `connector.yaml` invariants.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Step
slug: step

description: |
  A single transition in a sequence. Authored as a YAML string
  using the Unicode arrow `→`. Compiles to one connector record
  per step, tagged with parent (scenario, sequence, step-index).
  Permitted kinds are runtime-flow only.

# ── Properties ───────────────────────────────────────────────────
# These fields are what the model_compiler's `parse_step()` extracts
# from the authored arrow string.
properties:

  - name: src
    type: identifier
    description: |
      Parsed from the substring before the arrow. Bare id —
      qualified `<location>:<id>` form is rejected.

  - name: dst
    type: identifier
    description: |
      Parsed from the substring after the arrow (and after the
      optional `[kind]` annotation). Same rules as src.

  - name: kind
    type:
      enum: connector-type
    default: calls
    description: |
      Connector type for the emitted edge. Defaults to `calls` when
      the step has no `[kind]` annotation. Permitted: `calls`,
      `event`, `consumes`. Other types in step form are rejected by
      the compiler with a clear error.

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: |
      Both `src` and `dst` resolve in the global namespace (actor,
      block, location, or component). The compiler reports the
      unresolved id.

  - description: |
      `kind` is one of the runtime-flow types — structural types
      (enabled-by, hosted-by, available-through) are rejected in
      step authoring with a hint to express them as standalone
      connectors instead.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: arrow-string
    description: |
      A step is always a string. The `→` character is the canonical
      separator. The parser allows arbitrary whitespace around the
      arrow so authors can align columns for readability.
    example: |
      steps:
      - business-user        → chat-surface              # calls (default)
      - chat-surface         → business-agent
      - agent-orchestrator   →[consumes] knowledge-index
      - external-ai-agent    →[event]    command-bus

references:
  - modeling_engine/wiki/02-schema.md
  - modeling_engine/Compiler/model_compiler.py
