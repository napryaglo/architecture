# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Concept: Scenario
# ═════════════════════════════════════════════════════════════════
# A desired outcome together with one or more sequences that deliver
# it. Carries a label, an optional outcome description, and a non-
# empty list of sequences.
#
# Why a scenario is multi-sequence. Real architectures have outcomes
# reachable from multiple entry points — a "Conversational" outcome
# might be initiated by a business user OR by an autonomous agent;
# both end at the same delivered response. Modelling this as one
# scenario with two sequences keeps the *outcome* coherent (the
# business definition of what success looks like) while letting each
# entry point be authored as its own ordered flow. Splitting
# alternates into separate scenarios would dilute "scenario" — see
# the decision-log entry "Scenarios become multi-sequence
# (2026-05-03)" for the longer rationale.
#
# What scenarios buy you in tooling:
#
#   - Validation. Scenarios are how the architecture is justified —
#     a component that participates in no scenario has no business
#     reason for being there. Future orphan-detection runs against
#     this. (Not yet implemented.)
#
#   - Filtered visualisation. The architecture viewer's right-rail
#     lets the user toggle individual sequences; the connectors that
#     belong to the toggled sequence(s) light up. The flow-membership
#     index is built per scenario step — see `connector.yaml`.
#
#   - Auto-generated sequence diagrams. The toolchain renders one
#     SVG per (scenario, sequence) tuple, displayed on demand by the
#     viewer. The participants are the components/actors mentioned in
#     the steps, in first-appearance order with the Entry Point
#     forced leftmost.
# ═════════════════════════════════════════════════════════════════

kind: concept
name: Scenario
slug: scenario

description: |
  A desired outcome together with one or more sequences of component
  interactions that deliver it. Carries a label, an optional outcome
  description, and a non-empty list of sequences. Multi-sequence
  scenarios capture cases where the same outcome is reachable from
  different entry points.

# ── Properties ───────────────────────────────────────────────────
properties:

  - name: id
    type: identifier
    description: Stable kebab-case scenario id (the YAML key).

  - name: label
    type: string
    description: |
      Human-readable scenario name; surfaces in the viewer's
      right-rail tree as a section header above the per-sequence
      buttons.

  - name: outcome
    type: text
    cardinality: '0..1'
    description: |
      The condition that defines success, expressed in terms
      meaningful to the actor that initiated the scenario. A scenario
      without an outcome cannot be evaluated — there is no basis for
      determining whether the sequence is correct or complete.
      Optional in the schema (the compiler doesn't require it) but
      strongly recommended.

  - name: sequences
    type:
      list:
        ref: sequence
    cardinality: '1..*'
    description: |
      One or more sequences that achieve the outcome. At least one is
      required — a scenario with no sequences has no concrete
      behaviour and is rejected by the compiler.

# ── Invariants ───────────────────────────────────────────────────
invariants:

  - description: Scenario ids are unique within the model.

  - description: |
      Each scenario has at least one sequence. Empty `sequences:`
      lists are rejected with a clear error.

# ── Authoring ────────────────────────────────────────────────────
authoring:

  - form: dict-form
    description: |
      YAML key is the scenario id; the value is an object with
      `label`, `outcome`, and `sequences:`. The most common form;
      no list-form alternative exists for scenarios.
    example: |
      scenarios:
        conversational:
          label: Conversational
          outcome: Grounded, permission-scoped response; no system state modified
          sequences:
            - sequence:
                Title: User-Initiated Conversation with AI Agent
                Entry Point: business-user
                steps:
                - business-user → chat-surface
                - chat-surface  → business-agent
                - ...

references:
  - adl/meta-models/enterprise-architecture/wiki/concepts/architecture-scenario.md
  - modeling_engine/wiki/02-schema.md
  - modeling_engine/wiki/06-decision-log.md
