# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Meta-model: Enterprise Architecture
# ═════════════════════════════════════════════════════════════════
# The Pragmatic Architecture Framework v2 meta-model. Describes an
# enterprise architecture as locations containing components and
# blocks, actors initiating scenarios, scenarios composed of
# sequences of typed connectors. The original (and until BPMN
# arrived, only) meta-model in this ADL.
#
# Source files: `<id>.arch.yaml`. Compiled by
# `modeling_engine/Compiler/model_compiler.py`. Visual DSL: `.view`,
# compiled through `visual_engine/markup/view_compiler/view_compiler.py`.
#
# All concepts / enums / primitives this meta-model uses live under
# `adl/meta-models/enterprise-architecture/{concepts,enums}/` plus
# the shared primitives at `adl/primitives/`.
# ═════════════════════════════════════════════════════════════════

kind: meta-model
name: Enterprise Architecture
slug: enterprise-architecture
description: |
  Meta-model for enterprise architectures. Top-level
  abstraction is a `model` (one `.arch.yaml` source file) containing
  locations, actors, blocks, components, scenarios, and the
  connectors between them.

version: 2
extension:      .arch.yaml
view-extension: .view

root-concept: model

top-level-concepts:
  - actor
  - block
  - component
  - connector
  - library
  - location
  - model
  - project
  - scenario
  - sequence
  - step
  - technology
  - view

references:
  - modeling_engine/wiki/01-meta-model.md
  - modeling_engine/wiki/02-schema.md
  - modeling_engine/Compiler/model_compiler.py
  - adl/meta-models/enterprise-architecture/wiki/index.md
