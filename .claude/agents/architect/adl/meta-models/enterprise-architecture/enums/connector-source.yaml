# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Connector Source
# ═════════════════════════════════════════════════════════════════
# Tags each connector record in the compiled model with the
# authoring surface it came from. The compiler emits a unified
# `connectors:` block that mixes records from two surfaces; this
# tag lets downstream tooling tell them apart without re-parsing.
#
# Two practical uses today:
#
#   1. The design-smell warning. The compiler counts standalone
#      `calls` connectors (those with `source: connectors`) and
#      warns at five or more — many standalone calls means
#      components are connected without scenario coverage that
#      explains why. Scenario-step calls are exempt from the count.
#
#   2. The architecture viewer's flow-membership lookup. The markup
#      compiler builds an index `(from, to) → [flows]` from the
#      scenario-step records only — structural connectors don't
#      participate in scenarios and don't get flow membership.
#
# Authors don't write this tag — the compiler stamps it. It only
# appears in compiled output, not in source.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Connector Source
slug: connector-source

description: |
  How a connector entry got into the compiled model. The compiler
  emits a unified `connectors:` block from two authoring surfaces;
  this tag preserves which surface a given record came from. Authors
  don't write this — the compiler stamps it.

values:

  - id:    scenario-step
    label: Scenario Step
    description: |
      Derived from a step inside a scenario sequence. Carries
      additional `scenario`, `sequence`, and `step` metadata. One
      record per `(scenario, sequence, step)` tuple — the same drawn
      line on the diagram is matched against all of them via the
      markup compiler's `(from, to) → [flows]` index.

  - id:    connectors
    label: Source connectors block
    description: |
      Authored explicitly in the source `connectors:` block — object,
      pair, or natural-language form. May carry a `natural:` field
      preserving the original prose for traceability. These are the
      structural edges (enabled-by, hosted-by, available-through)
      that don't fit a scenario timeline, plus any standalone calls
      the author wants to record.

references:
  - modeling_engine/Compiler/model_compiler.py
