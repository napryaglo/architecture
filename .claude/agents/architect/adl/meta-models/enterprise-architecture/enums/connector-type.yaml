# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Connector Type
# ═════════════════════════════════════════════════════════════════
# The six typed edges between model elements. Three describe runtime
# behaviour (calls, event, consumes); three describe structural facts
# (available-through, enabled-by, hosted-by). This split is
# load-bearing — runtime types are what scenarios "do", structural
# types are what the architecture "is". A scenario step never says
# "X is hosted by Y" because that's not a runtime act; it always says
# "X calls Y" or "X emits an event Y receives".
#
# Two authoring surfaces emit connectors:
#
#   - Scenario steps emit runtime-flow types only. Default is `calls`
#     when omitted. Brackets annotate non-default kinds:
#       A → B          → calls (default)
#       A →[event] B   → event
#       A →[consumes] B → consumes
#
#   - The standalone `connectors:` block accepts all six types. Pair
#     shorthand `[A, B]` is sugar for `type: calls`. Object form is
#     required for non-default types or extra metadata.
#
# Why exactly six (and not more): every relationship the toolchain
# needs to represent fits one of these. The set was settled in the
# decision log — see `modeling_engine/wiki/06-decision-log.md` for the
# longer rationale, including the UML influences (sync/async messages,
# `«deploy»` and `«manifest»` stereotypes, dashed dependencies).
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Connector Type
slug: connector-type

description: |
  The six typed edges between model elements. Three describe runtime
  behaviour (calls, event, consumes); three describe structural facts
  (available-through, enabled-by, hosted-by). Every connector in the
  compiled model carries exactly one of these as its `type:`.

values:

  # ── Runtime-flow types ─────────────────────────────────────────
  # These three are what scenario steps emit.

  - id:    calls
    label: Calls
    description: |
      Synchronous runtime invocation. A calls B and waits for response.
      Default for scenario steps when no kind is annotated; the most
      common edge in any architecture.

  - id:    event
    label: Event
    description: |
      Asynchronous runtime emission. A emits an event B reacts to.
      Visual rendering and semantics differ from `calls` (UML's
      async-message convention is what we follow here). When the
      receiver is a topic/queue/log, prefer this over `calls` even if
      the wire-level mechanics involve a synchronous publish API.

  - id:    consumes
    label: Consumes
    description: |
      A reads or uses data/services from B as part of its operation.
      Distinct from `calls` (no specific method invocation; can be
      data flow, subscription, lookup). Common targets: data stores,
      knowledge sources, semantic indexes.

  # ── Structural types ───────────────────────────────────────────
  # These three describe facts about the architecture itself, not
  # runtime behaviour. Authored only in the standalone connectors:
  # block; rejected if found in a scenario step.

  - id:    available-through
    label: Available Through
    description: |
      A is exposed/accessed via B. The "access path" relationship —
      a public API exposed through an internal gateway, a tool exposed
      through an MCP server, a model served through an inference
      endpoint.

  - id:    enabled-by
    label: Enabled By
    description: |
      B is the platform/tool used to author, build, or configure A.
      Build-time / authoring relationship. Example: a Power Platform
      agent is enabled-by Copilot Studio (the authoring surface), not
      hosted-by it.

  - id:    hosted-by
    label: Hosted By
    description: |
      B is the runtime container that operates A in production. UML's
      `«deploy»` stereotype. Distinct from enabled-by because the same
      tool may both author AND host an artifact (Copilot Studio does
      both for its agents) — the model says so explicitly with two
      separate hosted-by + enabled-by edges.

references:
  - modeling_engine/wiki/01-meta-model.md
  - modeling_engine/wiki/06-decision-log.md
  - modeling_engine/Compiler/model_compiler.py
