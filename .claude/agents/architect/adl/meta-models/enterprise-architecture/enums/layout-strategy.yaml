# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Layout Strategy
# ═════════════════════════════════════════════════════════════════
# How a layout panel positions its children. Selected by a panel
# primitive (canvas, hstack, vstack, ugrid, grid, dock-panel) at the
# .view-source level, or by an `items-presenter`'s `layout:` field
# inside a ControlTemplate.
#
# Some lineage to keep in mind: these names mirror WPF's panel set
# (StackPanel, DockPanel, UniformGrid, Grid) plus a "canvas" mode
# that's our equivalent of WPF's Canvas (absolute positioning, no
# automatic placement). The visual engine implements the spec's
# two-pass measure/arrange pipeline; each strategy here is a
# distinct measure+arrange pair.
#
# The aliases reflect the .view DSL's compact shorthand: authors
# write `vstack` or `hstack` rather than `stack-panel-vertical`,
# but the emitted markup uses the long form so renderers can
# dispatch on a single canonical name.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Layout Strategy
slug: layout-strategy

description: |
  How a layout panel positions its children. Selected by the panel
  primitive or by an `items-presenter`'s `layout:` field. Names
  mirror WPF's panel set, with `canvas` for absolute positioning.

values:

  - id:    canvas
    label: Canvas
    description: |
      Absolute positioning. Children carry their own (x, y); the
      canvas does no automatic placement. Shrink-wraps to children's
      bounds unless dimensions are declared explicitly. The
      architecture-view's root panel is a canvas; locations and
      blocks default to canvas inside their templates.

  - id:    stack-panel-vertical
    label: Stack Panel — Vertical
    description: |
      Children flow top to bottom. Cross-axis (horizontal) alignment
      governed by each child's `h-align`. Total height = sum of child
      heights plus margins. Pinned children with explicit `at:` keep
      their offset and push the cursor for following flow children.
    aliases: [v-stack, vstack]

  - id:    stack-panel-horizontal
    label: Stack Panel — Horizontal
    description: |
      Children flow left to right. Cross-axis (vertical) alignment
      governed by each child's `v-align`. Symmetric to the vertical
      stack.
    aliases: [h-stack, hstack]

  - id:    dock-panel
    label: Dock Panel
    description: |
      Children dock to panel edges in declaration order. Each child
      consumes its declared edge plus its main dimension; the
      remaining inner area passes to the next child. The last child
      fills the leftover when `last-child-fills` is true (the
      default).
    aliases: [dock]

  - id:    uniform-grid
    label: Uniform Grid
    description: |
      Equal-sized cells. Cell size = max(child.width) ×
      max(child.height) across all children. Children declare their
      cell via `cell: (col, row)` (1-indexed). Distinct from `grid`
      which has per-row/per-column sizing — uniform-grid trades that
      flexibility for a much simpler layout pass.
    aliases: [ugrid]

  - id:    grid
    label: Grid
    description: |
      WPF-style grid with per-row and per-column sizing rules. Each
      row/col carries pixel | auto | star sizing. Children declare
      (row, col) and may span multiple cells via row-span / col-span.
      Used for irregular-grid layouts where uniform-grid is too
      restrictive.
    aliases: [wpf-grid]

references:
  - visual_libraries/Default/visual_primitives.yaml
  - visual_engine/markup/markup_compiler/markup_compiler.py
