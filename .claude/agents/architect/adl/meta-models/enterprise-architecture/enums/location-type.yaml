# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Location Type
# ═════════════════════════════════════════════════════════════════
# Classifies an architecture location by its physical/logical
# character. Authored as `type:` on every location record.
#
# Two concrete uses today:
#
#   1. Default visual styling. The view_compiler maps each type to a
#      fill+stroke palette so a viewer can tell at a glance which
#      locations are cloud regions vs physical datacenters vs
#      organisational buckets. Specifically:
#         physical                   → warning-amber
#         cloud/paas                 → cyan
#         cloud/saas                 → brand-green
#         logical-grouping           → plum
#         physical/logical-grouping  → warning-amber (treated like physical)
#         (no type / unknown)        → neutral grey
#      Authors can override per-location, but the type-driven default
#      is what most diagrams want.
#
#   2. Future modernization-path reasoning. The ADL's modernization-
#      path concept (see adl/meta-models/enterprise-architecture/wiki/primitives/modernization-path.md)
#      depends on knowing which type-pairs admit which transformation
#      strategies. Not yet wired into the compiler; type is captured
#      now so the data is there when it is.
#
# The slash-bearing values (cloud/paas, physical/logical-grouping)
# look like CSS or path syntax but are intentional: the prefix names
# the physical character, the suffix names the modal behaviour.
# Treat them as opaque string ids.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Location Type
slug: location-type

description: |
  Classifies an architecture location by its physical/logical
  character. Drives default visual styling and informs reasoning
  about modernization paths between location types.

values:

  - id:    cloud/paas
    label: Cloud — PaaS
    description: |
      Cloud platform-as-a-service region. Examples: Azure subscriptions,
      AWS regions, GCP projects. Vendor-managed runtime; tenant-managed
      configuration. Default tint: cyan.

  - id:    cloud/saas
    label: Cloud — SaaS
    description: |
      Cloud software-as-a-service tenant. Examples: Microsoft 365,
      Power Platform, Salesforce. Vendor-managed application AND
      runtime; tenant-managed data and policy. Default tint:
      brand-green.

  - id:    physical
    label: Physical
    description: |
      Physical infrastructure under enterprise control. Datacenter
      racks, manufacturing-floor edge devices, lab equipment. Default
      tint: warning-amber.

  - id:    physical/logical-grouping
    label: Physical — Logical Grouping
    description: |
      Logical bucket spanning physical infrastructure across sites.
      Common usage: "On-Premises" as a single rendered location even
      though it covers multiple datacenters. Default tint:
      warning-amber (treated like physical).

  - id:    logical-grouping
    label: Logical Grouping
    description: |
      Pure organisational bucket with no inherent physical or
      platform meaning. Common usage: "3rd-Party SaaS" as a single
      bucket for the set of external SaaS apps the enterprise uses,
      without modelling each tenant individually. Default tint:
      plum.

references:
  - visual_engine/markup/view_compiler/view_compiler.py
  - ai_ea/models/enterprise/enterprise.arch.yaml
