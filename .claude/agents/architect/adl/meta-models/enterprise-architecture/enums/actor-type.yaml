# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Actor Type
# ═════════════════════════════════════════════════════════════════
# Classifies an actor's relationship to the enterprise trust
# boundary. Authored as `type:` on every actor record. Three values
# today; the set is intentionally small — finer-grained
# classifications (employee vs contractor, partner vs anonymous)
# would dilute the visual signal without adding modelling power.
#
# Why the set is closed: actor type drives visual treatment
# (different icon set for external-ai actors), and may inform
# scenario validation in the future (e.g. "only authenticated actor
# types can initiate flows through internal surfaces"). Open-set
# values would scatter both behaviours.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Actor Type
slug: actor-type

description: |
  Classifies actors by their relationship to the enterprise trust
  boundary. Drives visual treatment in the architecture viewer and
  informs scenario validation.

values:

  - id:    internal
    label: Internal
    description: |
      Authenticated party inside the enterprise — employees,
      contractors, operations stakeholders. Authenticates via the
      enterprise identity provider; sees internal applications.

  - id:    external
    label: External
    description: |
      Unauthenticated or partner-trust party outside the enterprise.
      Reaches the system only through public surfaces (public-api,
      partner-integration-endpoint, public-mcp-server).

  - id:    external-ai
    label: External AI Agent
    description: |
      Autonomous agent operated by a third party that interacts with
      the enterprise via published machine surfaces (public-mcp-server,
      partner-integration-endpoint). Distinct from `external` because
      the semantics of agent-driven traffic differ — different rate
      limits, different audit trails, different consent model. Worth a
      separate visual treatment so a viewer can tell at a glance which
      actors are humans vs which are agents.

references:
  - modeling_engine/wiki/01-meta-model.md
  - ai_ea/models/enterprise/enterprise.arch.yaml
