# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Enum: Component Category
# ═════════════════════════════════════════════════════════════════
# The type-level archetype every component instantiates. The largest
# enum in the spec (around 40 values) and the most domain-loaded.
# Authors pick a category for every component they declare; the
# model_compiler validates that the chosen value resolves here (or
# in an architecture-level inline override).
#
# Categories are organised into six fundamental roles. The grouping
# is not represented in the YAML structure (a value's role is
# implicit in the section it appears in) but it's the framing the
# wiki uses and the only sensible mental model for picking a category
# when authoring:
#
#   Application         — user-facing surfaces (chat, web, mobile)
#   Service             — components that process, transform, delegate
#   Data Store          — components that persist or stream data
#   Capability Surface  — gateways exposing capability inside one tenant
#   Public Surface      — gateways across the enterprise perimeter
#   Federated Surface   — shared multi-capability infrastructure
#
# Aliases. Several values declare aliases (`ai-chat` →
# `conversational-interface`, `database` → `relational-store`, etc.)
# because two names emerged in practice for the same archetype and
# both are in active use across libraries. The resolver treats
# aliases as equivalent at validation time; the canonical id is the
# `id:` field of the value, and aliases never appear as canonical
# elsewhere in the spec.
#
# What governs additions: a new category is a meta-model migration.
# It needs a default icon (in `technology_library/default/index.yaml`)
# and ideally a wiki entry in `adl/meta-models/enterprise-architecture/wiki/concepts/component-category.md`.
# Don't add categories speculatively — collapse cases that aren't
# behaviourally distinct from existing ones into aliases of those.
# ═════════════════════════════════════════════════════════════════

kind: enum
name: Component Category
slug: component-category

description: |
  The type-level archetype every component instantiates. Categories
  group components by the role they play in the architecture
  regardless of the underlying technology. Around 40 values across
  six fundamental roles (application, service, data store, capability
  surface, public surface, federated surface). Several values declare
  aliases that the resolver treats as equivalent.

values:
  # ── Application ────────────────────────────────────────────────
  - id: web-portal
    label: Web Portal
    description: Browser-rendered application accessed via URL.
  - id: mobile-app
    label: Mobile App
    description: Native or hybrid mobile application.
  - id: desktop-app
    label: Desktop App
    description: Native desktop application installed on a workstation.
  - id: conversational-interface
    label: Conversational Interface
    description: Chat-based front-end through which actors converse with the system.
    aliases: [ai-chat]
  - id: legacy-application
    label: Legacy Application
    description: Pre-existing application not slated for replacement; integrated via adapters.
  - id: embedded-widget
    label: Embedded Widget
    description: Application surface hosted inside another application's chrome.
  - id: reporting-surface
    label: Reporting Surface
    description: Dashboard or report-rendering application.

  # ── Service ────────────────────────────────────────────────────
  - id: api-service
    label: API Service
    description: A service that exposes a programmatic interface; typically RESTful or RPC.
    aliases: [service, api]
  - id: workflow-engine
    label: Workflow Engine
    description: Orchestrates long-running processes spanning multiple services or human steps.
  - id: orchestration-engine
    label: Orchestration Engine
    description: Coordinates short-running interactions between agents or services.
  - id: integration-adapter
    label: Integration Adapter
    description: Bridges between architectures or between protocols/data formats.
  - id: event-processor
    label: Event Processor
    description: Consumes events from a stream and reacts (transform, dispatch, accumulate).
  - id: notification-service
    label: Notification Service
    description: Delivers messages to actors via email, push, SMS, etc.
  - id: ai-agent
    label: AI Agent
    description: An autonomous or semi-autonomous AI workload that takes actions on behalf of a user or system.
  - id: language-model
    label: Language Model
    description: Foundation model serving completions/embeddings.
    aliases: [foundation-model]
  - id: rag
    label: RAG
    description: Retrieval-augmented generation pipeline component.
  - id: scheduler
    label: Scheduler
    description: Triggers workloads on a time- or event-based schedule.
  - id: authorization-service
    label: Authorization Service
    description: Decides whether a principal may perform an action on a resource.
  - id: platform-api
    label: Platform API
    description: A unified platform-wide programmatic surface (e.g. Microsoft Graph).

  # ── Data Store ─────────────────────────────────────────────────
  - id: relational-store
    label: Relational Store
    description: Tables-and-rows persistence.
    aliases: [database]
  - id: document-store
    label: Document Store
    description: Semi-structured document persistence.
    aliases: [data-store]
  - id: file-store
    label: File Store
    description: Blob/object storage indexed by path or key.
  - id: event-log
    label: Event Log
    description: Append-only stream of events; consumers replay or tail.
  - id: message-queue
    label: Message Queue
    description: Point-to-point durable message delivery.
    aliases: [messaging]
  - id: knowledge-source
    label: Knowledge Source
    description: External or curated body of knowledge intended for AI grounding.
  - id: analytical-store
    label: Analytical Store
    description: Columnar / OLAP store optimised for aggregate queries.
  - id: cache
    label: Cache
    description: In-memory or near-memory store for fast retrieval.

  # ── Capability Surface ─────────────────────────────────────────
  - id: internal-api-gateway
    label: Internal API Gateway
    description: Aggregates and exposes internal APIs to in-tenant consumers.
  - id: message-topic
    label: Message Topic
    description: Pub/sub topic exposing event streams across capabilities.
  - id: internal-mcp-server
    label: Internal MCP Server
    description: Model Context Protocol server exposing tools to in-tenant agents.
    aliases: [mcp-server]

  # ── Public Surface ─────────────────────────────────────────────
  - id: public-api
    label: Public API
    description: API exposed across the enterprise trust boundary.
  - id: partner-integration-endpoint
    label: Partner Integration Endpoint
    description: B2B integration surface for named external partners.
  - id: public-mcp-server
    label: Public MCP Server
    description: Model Context Protocol server exposed to external agents.

  # ── Federated Surface ──────────────────────────────────────────
  - id: enterprise-api-catalogue
    label: Enterprise API Catalogue
    description: Discoverable registry of APIs across the enterprise.
  - id: federated-identity-provider
    label: Federated Identity Provider
    description: Identity provider trusted across capability boundaries.
  - id: semantic-index
    label: Semantic Index
    description: Cross-capability vector / semantic search index.

references:
  - technology_library/default/index.yaml
  - adl/meta-models/enterprise-architecture/wiki/concepts/component-category.md
