# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# ADL spec — meta-meta-schema (shared across all meta-models)
# ═════════════════════════════════════════════════════════════════
# Lives at the ADL root because the format is identical for every
# meta-model. Each meta-model under `adl/meta-models/<name>/` follows
# this schema for its own concept/enum/primitive records, plus a
# `meta-model.yaml` descriptor at its root identifying it.
#
# Four things live here:
#
#   1. The grammar of `type:` field values (the type-spec grammar).
#      Wherever a record names a `type:`, the value is a string slug
#      or one of the five compound forms below.
#
#   2. The vocabulary of cardinality shorthands. Defaults differ by
#      block (`properties:` defaults to '1'; `relationships:` to '*')
#      because the natural reading does too.
#
#   3. The list of built-in primitives — type names that work without
#      an explicit primitive record under `adl/primitives/`. Shared
#      primitives (identifier, slug, label, edges, color) DO have
#      records, because they carry regex/shape constraints that
#      aren't expressible in just a name.
#
#   4. The five record kinds: spec-schema (this file), meta-model
#      (descriptor at each meta-model's root), enum, primitive, concept.
#
# Two consumers read this file: the spec validator (a small Python
# script that walks records and rejects dangling type refs), and any
# documentation generator that rebuilds the prose wiki from spec
# records. The model_compiler does NOT consume this file directly —
# its validation rules are derived from individual concept records,
# not from this meta-schema.
# ═════════════════════════════════════════════════════════════════

kind: spec-schema
version: 1

# ── Type-spec grammar ────────────────────────────────────────────
# Wherever a record names a `type:`, the value is one of:
#   - a primitive slug (string)         : "identifier", "slug", "string", "integer", "boolean", "text"
#   - an enum reference (object)        : { enum: <enum-slug> }
#   - a concept reference (object)      : { ref: <concept-slug> }
#   - a list spec (object)              : { list: <type-spec> }
#   - a union spec (object)             : { union: [<type-spec>, …] }
#   - an inline-object spec (object)    : { object: { <field>: <type-spec>, … } }
type-spec-grammar:
  forms:
    - { kind: primitive,        shape: 'string slug',
        examples: ['identifier', 'string', 'boolean'] }
    - { kind: enum-ref,         shape: '{ enum: <slug> }',
        example: '{ enum: connector-type }' }
    - { kind: concept-ref,      shape: '{ ref: <slug> }',
        example: '{ ref: component }' }
    - { kind: list,             shape: '{ list: <type-spec> }',
        example: '{ list: identifier }' }
    - { kind: union,            shape: '{ union: [<type-spec>, …] }',
        example: '{ union: [string, { list: string }] }' }
    - { kind: inline-object,    shape: '{ object: { <field>: <type-spec>, … } }',
        example: '{ object: { from: identifier, to: identifier } }' }

# ── Cardinality vocabulary ───────────────────────────────────────
cardinality:
  values:
    '1':    { meaning: 'Exactly one. Required.' }
    '0..1': { meaning: 'Zero or one. Optional.' }
    '*':    { meaning: 'Any number including zero. Optional.' }
    '1..*': { meaning: 'One or more. Required.' }
  defaults:
    properties:    '1'
    relationships: '*'

# ── Built-in primitives ──────────────────────────────────────────
# Available as type-spec values without an explicit primitive record.
# Project-specific primitives live under spec/primitives/.
built-in-primitives:
  - { slug: string,     description: 'Single-line text.' }
  - { slug: text,       description: 'Multi-line text — descriptions, prose blocks.' }
  - { slug: integer,    description: 'Whole number.' }
  - { slug: number,     description: 'Real number.' }
  - { slug: boolean,    description: 'true | false.' }
  - { slug: any,        description: 'Untyped value — used sparingly for free-form attribute bags.' }
  - { slug: code,       description: 'Verbatim source code or markup, language hinted in context.' }

# ── Record kinds ─────────────────────────────────────────────────

record-kinds:

  meta-model:
    description: |
      Descriptor at the root of each meta-model directory
      (`adl/meta-models/<name>/meta-model.yaml`). Identifies the
      meta-model — its slug, version, source-file extension, and the
      concept that plays the role of "the model" (the unit a per-meta-
      model compiler operates on). The orchestrator consults this
      record to dispatch a model in a project to the right compiler /
      visual library / view DSL extension.
    fields:
      kind:           { type: string, required: true, value: meta-model }
      name:           { type: string, required: true }
      slug:           { type: slug,   required: true,
                        description: 'Must equal the meta-model directory name.' }
      description:    { type: text,   required: true }
      version:
        type: integer
        cardinality: '0..1'
        description: 'Schema version of this meta-model. Bump on breaking changes.'
      extension:
        type: string
        description: |
          Filename suffix for source files in this meta-model
          (e.g. `.arch.yaml` for enterprise-architecture, `.bpmn.yaml`
          for bpmn). Lets the orchestrator route a model file to the
          right compiler.
      view-extension:
        type: string
        cardinality: '0..1'
        description: |
          Filename suffix for the visual DSL associated with this
          meta-model (e.g. `.view`). Distinct meta-models may share or
          carry their own DSLs.
      root-concept:
        type: { ref: concept }
        description: |
          Slug of the concept that is "the model" for this meta-model
          — the top-level entity a project descriptor points at via
          `models[].source:`. For enterprise-architecture this is
          `model`; for BPMN this is `process`.
      top-level-concepts:
        type: { list: identifier }
        cardinality: '*'
        description: |
          Concept slugs the meta-model exports as top-level authoring
          surfaces. Useful for tooling — IDE autocomplete, doc
          generators, schema-based validators.
      references: { type: { list: string } }

  enum:
    description: |
      Closed set of named values. A reference site declares the
      enum slug; instances must pick one of its `values[].id`s
      (or any `aliases:` thereof).
    fields:
      kind:        { type: string,     required: true, value: enum }
      name:        { type: string,     required: true,
                     description: 'Human-readable name (Title Case).' }
      slug:        { type: slug,       required: true,
                     description: 'Stable kebab-case id, must match the file basename.' }
      description: { type: text,       required: true }
      values:
        type: { list: { object: {
          id:          { type: identifier, required: true },
          label:       { type: string },
          description: { type: text },
          aliases:     { type: { list: identifier } },
        } } }
        cardinality: '1..*'
      references:
        type: { list: string }
        description: |
          Pointers (file paths or URLs) to wiki pages or source files
          where this enum surfaces. Useful for navigating from spec to
          implementation.

  primitive:
    description: |
      Base data type used by concept properties. Either a refinement
      of a built-in primitive (string with regex, integer with range)
      or a structured record (object with named fields).
    fields:
      kind:        { type: string, required: true, value: primitive }
      name:        { type: string, required: true }
      slug:        { type: slug,   required: true }
      description: { type: text,   required: true }
      base-type:
        type: string
        description: 'Built-in primitive this refines (string, integer, object, list, union).'
        cardinality: '0..1'
      regex:
        type: string
        description: 'Pattern constraint for string-based primitives.'
        cardinality: '0..1'
      shape:
        type: any
        description: |
          For object-based primitives: inline field map. Same grammar as
          a concept's `properties:` block but lighter — no relationships,
          no invariants.
        cardinality: '0..1'
      examples:
        type: { list: { object: { value: { type: any }, note: { type: text } } } }
      references: { type: { list: string } }

  concept:
    description: |
      First-class ADL entity. The unit users author and the compiler
      validates. Carries properties, relationships to other concepts,
      semantic invariants, and authoring examples.
    fields:
      kind:        { type: string, required: true, value: concept }
      name:        { type: string, required: true }
      slug:        { type: slug,   required: true }
      description: { type: text,   required: true }
      extends:
        type: { ref: concept }
        cardinality: '0..1'
        description: |
          Concept this one specialises. Inherited properties and
          invariants apply unless overridden.
      properties:
        type: { list: { object: {
          name:        { type: identifier, required: true },
          type:        { type: any,        required: true,
                         description: 'A type-spec — see type-spec-grammar above.' },
          cardinality: { type: string,
                         description: 'One of 1, 0..1, *, 1..*. Defaults to 1.' },
          required:    { type: boolean,
                         description: 'Convenience for cardinality starting at 1.' },
          description: { type: text },
          default:     { type: any,
                         description: 'Default value when omitted.' },
          constraints: { type: { list: any },
                         description: 'Free-form constraint records — kind plus parameters.' },
        } } }
      relationships:
        type: { list: { object: {
          name:        { type: identifier, required: true },
          target:      { type: { ref: concept }, required: true },
          cardinality: { type: string },
          description: { type: text },
        } } }
      invariants:
        type: { list: { object: {
          description: { type: text, required: true },
          formal:      { type: text,
                         description: 'Predicate-flavoured statement in plain text. Not executable.' },
        } } }
      authoring:
        type: { list: { object: {
          form:        { type: string,
                         description: 'e.g. "list-form", "dict-form", "object", "pair-shorthand", "natural-language".' },
          description: { type: text },
          example:     { type: code },
        } } }
      references: { type: { list: string } }
