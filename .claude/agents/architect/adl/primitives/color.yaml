# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Primitive: Color
# ═════════════════════════════════════════════════════════════════
# CSS-flavoured colour string. The renderer passes the value through
# to SVG attributes verbatim — no re-encoding, no validation against
# a palette. This is intentional: SVG accepts hex, named colours,
# rgb()/rgba()/hsl()/hsla(), and authors often want freedom to drop
# any of those in.
#
# The regex below is permissive — it accepts everything SVG itself
# would accept, including the special `none` keyword (no fill / no
# stroke). The validator's job here is to catch typos, not to
# enforce a brand palette; for project-wide colour governance, lint
# at the wiki/CSS layer rather than here.
# ═════════════════════════════════════════════════════════════════

kind: primitive
name: Color
slug: color

description: |
  CSS-style colour string. Hex (`#RRGGBB`, `#RGB`, `#RRGGBBAA`),
  named CSS colour, or `rgb()` / `rgba()` / `hsl()` / `hsla()` form.
  The renderer passes the value through to SVG attributes verbatim.

base-type: string

# Permissive on purpose. Catches "obvious typos" (a mid-string space,
# unbalanced parens, leading garbage) but doesn't try to police hue.
# `none` is included so authors can write `fill: none` to mean
# "no fill" — SVG's standard mechanism for transparent strokes/fills.
regex: '^(#[0-9A-Fa-f]{3,8}|rgb\(.+\)|rgba\(.+\)|hsl\(.+\)|hsla\(.+\)|[a-zA-Z]+)$'

examples:
  - value: '#FF6B00'
    note: |
      Project accent orange. Used for highlighted connectors and
      pressed-sequence buttons in the architecture viewer.
  - value: '#FAFAF9'
    note: Canvas off-white — the default architecture-view background.
  - value: 'none'
    note: |
      Special CSS keyword — no fill / no stroke. Common on a `<rect>`
      that exists only to clip or position children.

references:
  - visual_libraries/Default/architecture-view.yaml
  - visual_engine/renderer/render.py
