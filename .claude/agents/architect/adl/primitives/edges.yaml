# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Primitive: Edges
# ═════════════════════════════════════════════════════════════════
# Four-sided spacing record. Used for `padding` (inner space, no
# effect on the bounding box) and `margin` (outer space, expands or
# contracts the element's effective bounds). The ADL accepts three
# forms because authors reach for different shapes in different
# contexts:
#
#   - A bare number when all four sides are equal — the common case
#     for symmetric padding.
#   - A 4-tuple `(top, right, bottom, left)` clockwise from top —
#     compact, matches the CSS shorthand convention.
#   - A partial-override object — readable for asymmetric records
#     where only one or two sides are non-zero.
#
# Worth knowing: in the visual engine, `margin` shrinks an element's
# visible bounds (it eats from the outside in); `padding` does NOT
# change the bounding box, just the inner offset for children. If
# you find yourself reaching for "double margin" to explain a gap,
# you're probably wrong.
# ═════════════════════════════════════════════════════════════════

kind: primitive
name: Edges
slug: edges

description: |
  A four-sided spacing record. Used for `padding` and `margin` on
  visual elements. Three acceptable forms — a bare number (uniform),
  a 4-tuple `(top, right, bottom, left)`, or a partial-override
  object `{ top, right, bottom, left }` with missing sides defaulting
  to 0.

base-type: union

# Three-form union. The shape: union below documents the alternates
# the validator accepts; the model_compiler's `edges()` helper
# normalises any of them to the four-field record at parse time.
shape:
  union:
    - number
    - list: number
    - object:
        top:    { type: number, default: 0 }
        right:  { type: number, default: 0 }
        bottom: { type: number, default: 0 }
        left:   { type: number, default: 0 }

examples:
  - value: 10
    note: Uniform 10 px on all four sides.
  - value: [20, 5, 5, 5]
    note: |
      Top 20, right/bottom/left 5 — the common asymmetric form for
      blocks that carry a title bar and need extra top padding to
      seat the title above the contained components.
  - value: { top: 4, bottom: 4 }
    note: Vertical only; right/left default to 0.

references:
  - visual_libraries/Default/visual_primitives.yaml
  - visual_engine/markup/markup_compiler/markup_compiler.py
