# yaml-language-server: $schema=
# ═════════════════════════════════════════════════════════════════
# Primitive: Slug
# ═════════════════════════════════════════════════════════════════
# Slug is a *derived* identifier: same regex shape as Identifier,
# but produced by the toolchain rather than authored. The slugging
# function is canonical — three pieces of code must agree:
#
#   - `model_compiler._slug_sequence_id`   — stamps sequence ids on
#       scenario-step connectors at compile time.
#   - `toolchain/build.py`                  — duplicates the algorithm
#       when building the viewer manifest's scenario tree.
#   - `visual_engine/sequence_renderer/render.py` — looks up sequences
#       by slug when rendering sequence diagrams.
#
# The three keep agreement by all using the same regex
# `[^a-z0-9]+ → "-"` over the lowercased input, then trimming
# hyphens at the ends. Don't rewrite this lightly — if the slugging
# changes, every existing compiled artifact stops resolving against
# the manifest and the viewer breaks silently.
#
# A separate use of this primitive is component-id autogeneration.
# When a list-form component omits `id:`, the model_compiler
# slugifies `label + category` and dedup-merges parts in order. See
# `modeling_engine/Compiler/model_compiler.py:slugify`.
# ═════════════════════════════════════════════════════════════════

kind: primitive
name: Slug
slug: slug

description: |
  An identifier produced from a human label by lowercasing, replacing
  every non-alphanumeric run with a single hyphen, and trimming
  hyphens from the ends. Two consumers in the toolchain must agree
  on the slugging algorithm — the model_compiler that stamps ids,
  and downstream tools (manifest generator, sequence renderer) that
  look up by slug.

base-type: string
regex: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'

examples:
  - value: external-ai-agent-integration
    note: 'slug("External AI Agent Integration") — lowercased, spaces → hyphens.'
  - value: workflow-engine-service
    note: |
      slugify(label=["Workflow", "Engine"], category="service") — autogenerated
      component id when the author omits `id:`. Note "engine" + "service"
      both contribute parts.
  - value: knowledge-index-semantic
    note: |
      slugify(label=["Knowledge","Index"], category="semantic-index") —
      "index" already in label parts, so dedup-merging skips it on the
      category side and we get "knowledge-index-semantic" rather than
      "knowledge-index-semantic-index".

references:
  - modeling_engine/Compiler/model_compiler.py
  - toolchain/build.py
  - visual_engine/sequence_renderer/render.py
