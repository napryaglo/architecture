<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" font-family="'Cascadia Code','Fira Code',Consolas,monospace">
  <defs>
    <style>
      .bg     { fill: #1e1e2e; }
      .panel  { fill: #282839; stroke: #45475a; stroke-width: 1; rx: 10; }
      .title  { fill: #cba6f7; font-size: 20px; font-weight: 700; }
      .badge  { fill: #313244; }
      .code   { fill: #cdd6f4; font-size: 13.5px; white-space: pre; }
      .cmt    { fill: #7f849c; font-size: 13.5px; font-style: italic; }
      .h1     { fill: #89b4fa; font-size: 30px; font-weight: 700; }
      .sub    { fill: #6c7086; font-size: 14px; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="1160"/>

  <!-- Header -->
  <text class="h1" x="40" y="56">TypeScript Cheat Sheet</text>
  <text class="sub" x="40" y="80">functions &#183; classes &#183; interfaces &#183; loops &#183; expressions</text>
  <line x1="40" y1="92" x2="1240" y2="92" stroke="#45475a" stroke-width="1"/>

  <!-- ===================== FUNCTIONS ===================== -->
  <rect class="panel" x="20" y="110" width="600" height="350" rx="10"/>
  <text class="title" x="42" y="142">Functions</text>
  <line x1="42" y1="152" x2="598" y2="152" stroke="#45475a"/>
  <text class="code" x="42" y="178">
    <tspan x="42" dy="0"   class="cmt">// named declaration</tspan>
    <tspan x="42" dy="19">function add(a: number, b: number): number {</tspan>
    <tspan x="42" dy="19">  return a + b;</tspan>
    <tspan x="42" dy="19">}</tspan>
    <tspan x="42" dy="19" class="cmt">// arrow function, return type inferred</tspan>
    <tspan x="42" dy="19">const mul = (a: number, b: number) =&gt; a * b;</tspan>
    <tspan x="42" dy="19" class="cmt">// optional ?  default =  rest ...</tspan>
    <tspan x="42" dy="19">function greet(n: string, g = "Hi", ...t: string[]) {}</tspan>
    <tspan x="42" dy="19" class="cmt">// generic, constrained type parameter</tspan>
    <tspan x="42" dy="19">function first&lt;T&gt;(arr: T[]): T | undefined {</tspan>
    <tspan x="42" dy="19">  return arr[0];</tspan>
    <tspan x="42" dy="19">}</tspan>
    <tspan x="42" dy="19" class="cmt">// function type alias</tspan>
    <tspan x="42" dy="19">type BinOp = (a: number, b: number) =&gt; number;</tspan>
  </text>

  <!-- ===================== CLASSES ===================== -->
  <rect class="panel" x="20" y="480" width="600" height="440" rx="10"/>
  <text class="title" x="42" y="512">Classes</text>
  <line x1="42" y1="522" x2="598" y2="522" stroke="#45475a"/>
  <text class="code" x="42" y="548">
    <tspan x="42" dy="0">class Animal {</tspan>
    <tspan x="42" dy="19">  static count = 0;</tspan>
    <tspan x="42" dy="19">  protected name: string;          </tspan>
    <tspan x="42" dy="19">  constructor(name: string) {</tspan>
    <tspan x="42" dy="19">    this.name = name; Animal.count++;</tspan>
    <tspan x="42" dy="19">  }</tspan>
    <tspan x="42" dy="19">  speak(): void { console.log(this.name); }</tspan>
    <tspan x="42" dy="19">  get label(): string { return this.name; }</tspan>
    <tspan x="42" dy="19">}</tspan>
    <tspan x="42" dy="19" class="cmt">// inheritance + parameter property</tspan>
    <tspan x="42" dy="19">class Dog extends Animal {</tspan>
    <tspan x="42" dy="19">  constructor(name: string, public breed: string) {</tspan>
    <tspan x="42" dy="19">    super(name);</tspan>
    <tspan x="42" dy="19">  }</tspan>
    <tspan x="42" dy="19">  override speak(): void { console.log("bark"); }</tspan>
    <tspan x="42" dy="19">}</tspan>
    <tspan x="42" dy="19" class="cmt">// abstract base + implements</tspan>
    <tspan x="42" dy="19">abstract class Shape {</tspan>
    <tspan x="42" dy="19">  abstract area(): number;</tspan>
    <tspan x="42" dy="19">}</tspan>
  </text>

  <!-- ===================== INTERFACES ===================== -->
  <rect class="panel" x="640" y="110" width="620" height="320" rx="10"/>
  <text class="title" x="662" y="142">Interfaces &amp; Types</text>
  <line x1="662" y1="152" x2="1238" y2="152" stroke="#45475a"/>
  <text class="code" x="662" y="178">
    <tspan x="662" dy="0">interface User {</tspan>
    <tspan x="662" dy="19">  readonly id: number;</tspan>
    <tspan x="662" dy="19">  name: string;</tspan>
    <tspan x="662" dy="19">  email?: string;            // optional member</tspan>
    <tspan x="662" dy="19">  greet(): string;           // method signature</tspan>
    <tspan x="662" dy="19">}</tspan>
    <tspan x="662" dy="19">interface Admin extends User { role: "admin"; }</tspan>
    <tspan x="662" dy="19" class="cmt">// index signature</tspan>
    <tspan x="662" dy="19">interface Dict { [key: string]: number; }</tspan>
    <tspan x="662" dy="19" class="cmt">// type alias: unions, intersections</tspan>
    <tspan x="662" dy="19">type Id = string | number;</tspan>
    <tspan x="662" dy="19">type Staff = User &amp; { dept: string };</tspan>
  </text>

  <!-- ===================== LOOPS ===================== -->
  <rect class="panel" x="640" y="450" width="620" height="270" rx="10"/>
  <text class="title" x="662" y="482">Loops &amp; Cycles</text>
  <line x1="662" y1="492" x2="1238" y2="492" stroke="#45475a"/>
  <text class="code" x="662" y="518">
    <tspan x="662" dy="0">for (let i = 0; i &lt; n; i++) { }</tspan>
    <tspan x="662" dy="19">for (const x of [1, 2, 3]) { }     // values</tspan>
    <tspan x="662" dy="19">for (const k in obj) { }           // keys</tspan>
    <tspan x="662" dy="19">while (cond) { }</tspan>
    <tspan x="662" dy="19">do { /* ... */ } while (cond);</tspan>
    <tspan x="662" dy="19" class="cmt">// control flow: break / continue</tspan>
    <tspan x="662" dy="19">for (const n of nums) { if (n &lt; 0) continue; }</tspan>
    <tspan x="662" dy="19" class="cmt">// array iteration helpers</tspan>
    <tspan x="662" dy="19">arr.forEach((n) =&gt; console.log(n));</tspan>
    <tspan x="662" dy="19">const doubled = arr.map((n) =&gt; n * 2);</tspan>
  </text>

  <!-- ===================== EXPRESSIONS ===================== -->
  <rect class="panel" x="640" y="740" width="620" height="400" rx="10"/>
  <text class="title" x="662" y="772">Expressions</text>
  <line x1="662" y1="782" x2="1238" y2="782" stroke="#45475a"/>
  <text class="code" x="662" y="808">
    <tspan x="662" dy="0"  class="cmt">// ternary conditional</tspan>
    <tspan x="662" dy="19">const s = n &gt; 0 ? "pos" : "neg";</tspan>
    <tspan x="662" dy="19" class="cmt">// optional chaining ?.   nullish ??</tspan>
    <tspan x="662" dy="19">const v = a?.b?.c ?? "default";</tspan>
    <tspan x="662" dy="19" class="cmt">// template literal</tspan>
    <tspan x="662" dy="19">const msg = `Hello, ${name}!`;</tspan>
    <tspan x="662" dy="19" class="cmt">// destructuring (object / array)</tspan>
    <tspan x="662" dy="19">const { x, y } = point;</tspan>
    <tspan x="662" dy="19">const [head, ...rest] = list;</tspan>
    <tspan x="662" dy="19" class="cmt">// spread</tspan>
    <tspan x="662" dy="19">const merged = { ...a, ...b };</tspan>
    <tspan x="662" dy="19" class="cmt">// type assertion &amp; type guard</tspan>
    <tspan x="662" dy="19">const el = x as HTMLElement;</tspan>
    <tspan x="662" dy="19">if (typeof v === "string") { /* narrowed */ }</tspan>
    <tspan x="662" dy="19" class="cmt">// logical &amp;&amp; || , comparison === !==</tspan>
    <tspan x="662" dy="19">const ok = isValid &amp;&amp; count !== 0;</tspan>
  </text>

  <text class="sub" x="40" y="1145">Generated cheat sheet &#183; open in a browser or import into Mural</text>
</svg>
