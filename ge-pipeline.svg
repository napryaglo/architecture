<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1660" viewBox="0 0 980 1660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 z" fill="#444" />
    </marker>
    <style>
      .title           { font: bold 22px system-ui, sans-serif; fill: #1a3a5c; }
      .subtitle        { font: italic 13px system-ui, sans-serif; fill: #555; }
      .stage-title     { font: bold 15px system-ui, sans-serif; fill: #1a3a5c; }
      .stage-desc      { font: 12px system-ui, sans-serif; fill: #333; }
      .stage-tag       { font: italic 11px system-ui, sans-serif; fill: #5478a8; }
      .strategy        { font: 12px system-ui, sans-serif; fill: #333; }
      .strategy-note   { font: 11px system-ui, sans-serif; fill: #666; }
      .strategy-head   { font: bold 12px system-ui, sans-serif; fill: #2a3a4a; }
      .opt-head        { font: bold 12px system-ui, sans-serif; fill: #7a4a2a; }
      .stage-box       { fill: #e8f0fa; stroke: #5478a8; stroke-width: 1.5; }
      .stage-box-opt   { fill: #f4ece2; stroke: #b88860; stroke-width: 1.5; }
      .strategy-box    { fill: #fbfaf3; stroke: #b8b8a8; stroke-width: 1; }
      .arrow-line      { stroke: #444;  stroke-width: 2;  fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="1660" fill="white" />

  <text x="490" y="34" text-anchor="middle" class="title">ge Layout Pipeline — Stages and Strategies</text>
  <text x="490" y="56" text-anchor="middle" class="subtitle">stages flow top→bottom; each lists its interface and concrete implementations</text>

  <!-- 1. Graph Transforms -->
  <g transform="translate(30, 80)">
    <rect class="stage-box" width="280" height="130" rx="6" />
    <text x="14" y="24" class="stage-title">1. Graph Transforms</text>
    <text x="14" y="46" class="stage-desc">pre-layout cleanup via GraphPipeline;</text>
    <text x="14" y="62" class="stage-desc">each transform returns a new Graph.</text>
    <text x="14" y="118" class="stage-tag">interface: IGraphTransform (graph-transforms/)</text>
  </g>
  <g transform="translate(350, 80)">
    <rect class="strategy-box" width="600" height="130" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• DedupEdgesTransform <tspan class="strategy-note">— collapse exact duplicates</tspan></text>
    <text x="16" y="60" class="strategy">• CollapseAntiparallelEdgesTransform <tspan class="strategy-note">— A→B / B→A → first only</tspan></text>
    <text x="16" y="78" class="strategy">• FilterNodesTransform / FilterEdgesTransform <tspan class="strategy-note">— predicate-based</tspan></text>
    <text x="16" y="96" class="strategy">• DropIsolatedNodesTransform <tspan class="strategy-note">— remove nodes with no edges</tspan></text>
    <text x="16" y="114" class="strategy">• MapLabelsTransform <tspan class="strategy-note">— rewrite labels via callback</tspan></text>
  </g>
  <line class="arrow-line" x1="170" y1="210" x2="170" y2="236" marker-end="url(#arrow)" />

  <!-- 2. Layer Assignment -->
  <g transform="translate(30, 240)">
    <rect class="stage-box" width="280" height="100" rx="6" />
    <text x="14" y="24" class="stage-title">2. Layer Assignment</text>
    <text x="14" y="46" class="stage-desc">assign every node a depth (row);</text>
    <text x="14" y="62" class="stage-desc">throws on cycles in the input graph.</text>
    <text x="14" y="88" class="stage-tag">interface: ILayerAssigner (layer-assigner/)</text>
  </g>
  <g transform="translate(350, 240)">
    <rect class="strategy-box" width="600" height="100" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• LongestPathLayerAssigner <tspan class="strategy-note">— DFS longest path from sources</tspan></text>
    <text x="16" y="60" class="strategy-note">    pin set (firstLayerNodes) forces L0; non-pinned sources go to L1+.</text>
    <text x="16" y="78" class="strategy-note">    strict: every edge u→v requires depth(v) &gt; depth(u).</text>
  </g>
  <line class="arrow-line" x1="170" y1="340" x2="170" y2="366" marker-end="url(#arrow)" />

  <!-- 3. Layer Improver (optional) -->
  <g transform="translate(30, 370)">
    <rect class="stage-box-opt" width="280" height="110" rx="6" />
    <text x="14" y="24" class="stage-title">3. Layer Improver (optional)</text>
    <text x="14" y="46" class="stage-desc">post-reorder fixpoint: move nodes</text>
    <text x="14" y="62" class="stage-desc">across rows to cut logical crossings;</text>
    <text x="14" y="78" class="stage-desc">re-runs stages 4–7 on each change.</text>
    <text x="14" y="98" class="stage-tag">interface: ILayerImprover (layer-improver/)</text>
  </g>
  <g transform="translate(350, 370)">
    <rect class="strategy-box" width="600" height="110" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• AdjacentLayerMoveImprover <tspan class="strategy-note">— sifting-range depth moves</tspan></text>
    <text x="16" y="60" class="strategy-note">    cost = geometric crossings in LOGICAL (idx, depth) space</text>
    <text x="16" y="76" class="strategy-note">    options: maxPasses, allowSameLayerNeighbors</text>
    <text x="16" y="94" class="strategy-note">    (loose mode lets a node share a row with a pred/succ).</text>
  </g>
  <line class="arrow-line" x1="170" y1="480" x2="170" y2="506" marker-end="url(#arrow)" />

  <!-- 4. First-Layer Ordering -->
  <g transform="translate(30, 510)">
    <rect class="stage-box" width="280" height="80" rx="6" />
    <text x="14" y="24" class="stage-title">4. First-Layer Ordering</text>
    <text x="14" y="46" class="stage-desc">permute L0 to seed the down-sweep.</text>
    <text x="14" y="70" class="stage-tag">interface: IFirstLayerOrderer (first-layer-orderer/)</text>
  </g>
  <g transform="translate(350, 510)">
    <rect class="strategy-box" width="600" height="80" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• IdentityFirstLayerOrderer <tspan class="strategy-note">— passthrough (graph.nodes order)</tspan></text>
    <text x="16" y="60" class="strategy">• OutDegreeFirstLayerOrderer <tspan class="strategy-note">— sort by out-degree desc.</tspan></text>
  </g>
  <line class="arrow-line" x1="170" y1="590" x2="170" y2="616" marker-end="url(#arrow)" />

  <!-- 5. Dummy Insertion -->
  <g transform="translate(30, 620)">
    <rect class="stage-box" width="280" height="100" rx="6" />
    <text x="14" y="24" class="stage-title">5. Dummy Insertion</text>
    <text x="14" y="46" class="stage-desc">break multi-layer edges (span &gt; 1)</text>
    <text x="14" y="62" class="stage-desc">into chains through dummy nodes.</text>
    <text x="14" y="88" class="stage-tag">interface: IDummyInserter (dummy-inserter/)</text>
  </g>
  <g transform="translate(350, 620)">
    <rect class="strategy-box" width="600" height="100" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• ChainDummyInserter <tspan class="strategy-note">— classical: 1 dummy per intermediate layer</tspan></text>
    <text x="16" y="60" class="strategy">• SparseDummyInserter <tspan class="strategy-note">— Eiglsperger et al. 2005, JGAA 9(3)</tspan></text>
    <text x="16" y="78" class="strategy-note">    ≤ 2 dummies per edge: span≤1 none, span=2 r, span&gt;2 p+q.</text>
  </g>
  <line class="arrow-line" x1="170" y1="720" x2="170" y2="746" marker-end="url(#arrow)" />

  <!-- 6. Within-Layer Reordering -->
  <g transform="translate(30, 750)">
    <rect class="stage-box" width="280" height="100" rx="6" />
    <text x="14" y="24" class="stage-title">6. Within-Layer Reordering</text>
    <text x="14" y="46" class="stage-desc">alternating down/up sweeps; sort</text>
    <text x="14" y="62" class="stage-desc">each layer by a neighbor aggregate.</text>
    <text x="14" y="88" class="stage-tag">interface: IReorderer (reorderer/)</text>
  </g>
  <g transform="translate(350, 750)">
    <rect class="strategy-box" width="600" height="100" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• BarycenterReorderer <tspan class="strategy-note">— mean of neighbour indices</tspan></text>
    <text x="16" y="60" class="strategy">• MedianReorderer <tspan class="strategy-note">— Gansner et al. 1993 weighted median</tspan></text>
    <text x="16" y="78" class="strategy-note">    3-approximation worst case.</text>
  </g>
  <line class="arrow-line" x1="170" y1="850" x2="170" y2="876" marker-end="url(#arrow)" />

  <!-- 7. Local Improver (optional) -->
  <g transform="translate(30, 880)">
    <rect class="stage-box-opt" width="280" height="130" rx="6" />
    <text x="14" y="24" class="stage-title">7. Local Improver (optional)</text>
    <text x="14" y="46" class="stage-desc">polish stage-6 ordering by</text>
    <text x="14" y="62" class="stage-desc">adjacent-swap or whole-position</text>
    <text x="14" y="78" class="stage-desc">moves; commit when crossings drop.</text>
    <text x="14" y="120" class="stage-tag">interface: ILocalImprover (improver/)</text>
  </g>
  <g transform="translate(350, 880)">
    <rect class="strategy-box" width="600" height="130" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• TransposeImprover <tspan class="strategy-note">— Gansner 1993; iterated adjacent-swap</tspan></text>
    <text x="16" y="60" class="strategy">• GreedySwitchImprover <tspan class="strategy-note">— Eades &amp; Kelly 1986; single bidirectional pass</tspan></text>
    <text x="16" y="78" class="strategy">• SiftingImprover <tspan class="strategy-note">— Matuszewski et al. 1999; try every position</tspan></text>
    <text x="16" y="96" class="strategy">• IlpExactImprover <tspan class="strategy-note">— Jünger &amp; Mutzel 1997 formulation,</tspan></text>
    <text x="16" y="112" class="strategy-note">      solved by brute-force enumeration (|L|! per layer, ≤9).</text>
  </g>
  <line class="arrow-line" x1="170" y1="1010" x2="170" y2="1036" marker-end="url(#arrow)" />

  <!-- 8. Position Computation -->
  <g transform="translate(30, 1040)">
    <rect class="stage-box" width="280" height="110" rx="6" />
    <text x="14" y="24" class="stage-title">8. Position Computation</text>
    <text x="14" y="46" class="stage-desc">ordered layers (+ edges) → (x, y);</text>
    <text x="14" y="62" class="stage-desc">y = row · layerSpacingY; x depends</text>
    <text x="14" y="78" class="stage-desc">on strategy.</text>
    <text x="14" y="100" class="stage-tag">interface: IPositionComputer (position-computer/)</text>
  </g>
  <g transform="translate(350, 1040)">
    <rect class="strategy-box" width="600" height="110" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• CenteredGridPositionComputer <tspan class="strategy-note">— evenly space per layer, centred</tspan></text>
    <text x="16" y="60" class="strategy">• BrandesKopfPositionComputer <tspan class="strategy-note">— Brandes &amp; Köpf 2002</tspan></text>
    <text x="16" y="78" class="strategy-note">    chains join into blocks via median upper neighbour; compaction</text>
    <text x="16" y="94" class="strategy-note">    gives each block its leftmost x — connected chains share columns.</text>
  </g>
  <line class="arrow-line" x1="170" y1="1150" x2="170" y2="1176" marker-end="url(#arrow)" />

  <!-- 9. Vertical Alignment (optional) -->
  <g transform="translate(30, 1180)">
    <rect class="stage-box-opt" width="280" height="80" rx="6" />
    <text x="14" y="24" class="stage-title">9. Vertical Alignment (optional)</text>
    <text x="14" y="46" class="stage-desc">post-position pull on connected x.</text>
    <text x="14" y="70" class="stage-tag">interface: IVerticalAligner (vertical-aligner/)</text>
  </g>
  <g transform="translate(350, 1180)">
    <rect class="strategy-box" width="600" height="80" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• BarycenterVerticalAligner <tspan class="strategy-note">— iterative pull w/ minSpacing + clearance</tspan></text>
    <text x="16" y="62" class="strategy-note">    redundant when paired with BrandesKopfPositionComputer.</text>
  </g>
  <line class="arrow-line" x1="170" y1="1260" x2="170" y2="1286" marker-end="url(#arrow)" />

  <!-- 10. Port Assignment (optional) -->
  <g transform="translate(30, 1290)">
    <rect class="stage-box-opt" width="280" height="80" rx="6" />
    <text x="14" y="24" class="stage-title">10. Port Assignment (optional)</text>
    <text x="14" y="46" class="stage-desc">pick boundary attachment per edge.</text>
    <text x="14" y="70" class="stage-tag">interface: IPortAssigner (port-assigner/)</text>
  </g>
  <g transform="translate(350, 1290)">
    <rect class="strategy-box" width="600" height="80" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• CardinalPortAssigner <tspan class="strategy-note">— stack at N/E/S/W per side</tspan></text>
    <text x="16" y="60" class="strategy">• DistributedPortAssigner <tspan class="strategy-note">— fan out across the cardinal arc</tspan></text>
  </g>
  <line class="arrow-line" x1="170" y1="1370" x2="170" y2="1396" marker-end="url(#arrow)" />

  <!-- 11. Edge Routing (optional) -->
  <g transform="translate(30, 1400)">
    <rect class="stage-box-opt" width="280" height="100" rx="6" />
    <text x="14" y="24" class="stage-title">11. Edge Routing (optional)</text>
    <text x="14" y="46" class="stage-desc">positions + chains + (ports) →</text>
    <text x="14" y="62" class="stage-desc">polyline waypoints per real edge.</text>
    <text x="14" y="88" class="stage-tag">interface: IEdgeRouter (edge-router/)</text>
  </g>
  <g transform="translate(350, 1400)">
    <rect class="strategy-box" width="600" height="100" rx="4" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• PolylineEdgeRouter <tspan class="strategy-note">— follow chain through dummies (straight legs)</tspan></text>
    <text x="16" y="60" class="strategy">• OrthogonalEdgeRouter <tspan class="strategy-note">— V–H–V staircases between chain points</tspan></text>
    <text x="16" y="78" class="strategy">• StraightLineEdgeRouter <tspan class="strategy-note">— direct source-port → target-port, no bends</tspan></text>
  </g>

  <!-- Diagnostics -->
  <g transform="translate(30, 1520)">
    <rect class="strategy-box" width="280" height="90" rx="6" />
    <text x="14" y="22" class="stage-title">Diagnostics (parallel)</text>
    <text x="14" y="44" class="stage-desc">counters populate LastCrossings</text>
    <text x="14" y="60" class="stage-desc">for overlay on the rendered SVG.</text>
    <text x="14" y="82" class="stage-tag">interfaces: I{Geometric,Adjacent}CrossingCounter</text>
  </g>
  <g transform="translate(350, 1520)">
    <rect class="strategy-box" width="600" height="90" rx="6" />
    <text x="16" y="22" class="strategy-head">implementations:</text>
    <text x="16" y="42" class="strategy">• GeometricCrossingCounter <tspan class="strategy-note">— segment-segment intersect on real coords</tspan></text>
    <text x="16" y="60" class="strategy">• AdjacentCrossingCounter <tspan class="strategy-note">— pairwise inversions across adjacent layers</tspan></text>
    <text x="16" y="78" class="strategy-note">    + edge-node overlap penalty (geometric only).</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 1630)">
    <rect width="14" height="14" class="stage-box" />
    <text x="22" y="11" class="stage-desc">required stage</text>
    <rect x="170" width="14" height="14" class="stage-box-opt" />
    <text x="192" y="11" class="stage-desc">optional stage (default off or undefined-safe)</text>
  </g>
</svg>
