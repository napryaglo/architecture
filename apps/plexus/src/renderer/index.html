<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tight CSP for the renderer: no remote code; the icon font stylesheet
         is the one allowed external origin. -->
    <title>Plexus</title>

    <!-- Material Symbols Outlined — M3 icon font, referenced by TextBlock
         FontFamily / Shape-from-glyph resources. Same CDN pin as the mural
         demos so icon metrics match. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        html, body { height: 100%; margin: 0; overflow: hidden;
                     font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
        #app { height: 100%; width: 100%; background: #fff;
               overflow: hidden; cursor: default; }
        #app svg { display: block; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
